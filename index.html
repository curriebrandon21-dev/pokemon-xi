const releaseBeforeHardening=release;release=function(x,id,teamId=x.user){let t=x.teams[teamId],p=t.roster.find(z=>z.root===id);if(p&&x.phase!=='season'&&x.phase!=='playoffs'){let r=releaseBeforeHardening(x,id,teamId);let free=x.freeAgents?.find(z=>z.root===id);if(free){let reset=resetForm(free);Object.assign(free,reset)}return r}return releaseBeforeHardening(x,id,teamId)};

const keepersBeforeHardening=processKeepers;processKeepers=function(x){if(x.phase!=='keepers'||x.keeper.length!==6)return keepersBeforeHardening(x);x.fullSeasonSnapshots??=[];if(!x.fullSeasonSnapshots.some(z=>z.year===x.year))x.fullSeasonSnapshots.push({year:x.year,players:x.teams.flatMap(t=>t.roster.map(p=>({root:p.root,team:t.id,form:p.form,name:p.name,reg:clone(p.stats.reg),po:clone(p.stats.po)})))});return keepersBeforeHardening(x)};
// Actual draft grade based on selection value and roster needs.
function draftGrades(){let records=(g.draftLog||[]).filter(d=>d.year===g.year&&!d.forfeited);return g.teams.map(t=>{let own=records.filter(d=>d.team===t.id),quality=own.reduce((sum,d)=>{let p=t.roster.find(p=>p.root===d.root)||makePlayer(d.root);return sum+rosterValue(p)},0),average=own.length?quality/own.length:0;return {name:t.name,grade:average>=92?'A':average>=80?'B':average>=67?'C':average>=54?'D':'F',count:own.length,average:Math.round(average)}}).sort((a,b)=>b.average-a.average)}
const draftViewBeforeGrades=draftView;draftView=function(){let view=draftViewBeforeGrades();if(g.phase==='draft'||!g.draftLog?.length)return view;return view+`<div class="card"><h3>Draft Grades · Year ${g.year}</h3>${draftGrades().map(z=>`<div class="player"><span class="grow">${escapeHTML(z.name)} · ${z.count} picks</span><b class="gold">${z.grade}</b></div>`).join('')}</div>`};
const recapBeforeHardening=matchRecap;matchRecap=function(){let out=recapBeforeHardening();if(g.lastMatch?.resolution)out+=`<p class="notice">Decided by ${escapeHTML(g.lastMatch.resolution)}</p>`;return out};
