<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon XI Dynasty — Phase One</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f2e9;background:#080a09}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;background:#e7b84f;color:#0b0d0b;border:0;border-radius:10px;padding:12px 15px;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#242824;color:#f5f2e9;border:1px solid #42463f}.danger{color:#f7aaa0}.wrap{max-width:1180px;margin:auto;padding:18px}header{position:sticky;top:0;background:#0c0f0d;border-bottom:1px solid #383b34;z-index:4}.nav{display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap}.brand{font-size:22px;font-weight:900;color:#e7b84f;margin-right:18px}.nav button{background:transparent;color:#a7a8a1;padding:16px 12px}.nav button.active{color:#e7b84f;border-bottom:2px solid #e7b84f;border-radius:0}h1{color:#e7b84f;font-size:27px;margin:16px 0}h2{font-size:19px;color:#e7b84f;margin:0 0 12px}.muted{color:#aaa9a1}.panel{background:#151715;border:1px solid #383b34;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.pokemon{background:#1d221e;border:1px solid #343d34;border-radius:12px;padding:10px;text-align:center;min-width:0}.pokemon img{height:92px;width:100%;object-fit:contain}.pokemon b{display:block}.pokemon small{display:block;color:#a7a99e}.pokemon .stats{font-size:12px;line-height:1.7}.pokemon button{margin-top:8px;width:100%;padding:8px}.field{background:#10371f;border:2px solid #3b6448;border-radius:16px;padding:20px 8px;position:relative}.field:before{content:'';position:absolute;top:50%;left:0;right:0;border-top:2px solid #7aa58666}.field:after{content:'';position:absolute;top:50%;left:50%;width:115px;height:115px;border:2px solid #7aa58666;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.formation{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;position:relative;z-index:1}.slot{grid-column:span 4;text-align:center;border-radius:10px;padding:9px 3px;background:#09271799;border:1px solid #31533d;min-height:116px;cursor:pointer}.slot img{width:62px;height:62px;object-fit:contain;display:block;margin:auto}.slot span{display:block;font-size:12px}.slot.selected{outline:3px solid #e7b84f}.slot.mid{grid-column:span 4}.slot.def{grid-column:span 3}.slot.gk{grid-column:5/span 4}.badge{color:#e7b84f}.team-logo{height:62px;width:62px;object-fit:contain}.club{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid #343b35;border-radius:10px;background:#1d221e;cursor:pointer}.club.selected{outline:2px solid #e7b84f}.club img{width:45px;height:45px;object-fit:contain}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}input{background:#222721;color:white;border:1px solid #51594c;border-radius:8px;padding:11px;width:100%;max-width:300px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 6px;text-align:left;border-bottom:1px solid #343834}th{color:#e7b84f}.notice{border-left:3px solid #e7b84f;padding:10px;background:#2b2619}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.pick{background:#252114;border:1px solid #6c562b;border-radius:10px;padding:12px}.empty{opacity:.7}.mobilehint{font-size:12px;color:#a6b3a5}@media(max-width:600px){.wrap{padding:12px}.panel{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{min-height:100px}.slot img{height:48px;width:48px}.slot span{font-size:11px}.brand{font-size:17px}h1{font-size:23px}}
</style></head><body><header><div class="wrap nav"><span class="brand">XI DYNASTY</span><button data-tab="draft">DRAFT</button><button data-tab="team">MY TEAM</button><button data-tab="clubs">CLUBS</button><button data-tab="rules">RULES</button></div></header><main id="app" class="wrap"></main><script>
const CLUBS=['Normal FC','Dynamo Fire','Racing Water','Electric City','Grass Wanderers','Ice Palace','Club Fighting','Inter Poison','Real Ground','Flying Rangers','Sporting Psychic','Bug Albion','Rock Rovers','Ghost Union','Dragon Hotspur','Dark Olympique','Steel Athletic','Fairy Town','AC Mythic','Cosmic United'];
const TYPES=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
const REGIONS=[151,251,386,493];const STARTERS=new Set([3,6,9,154,157,160,254,257,260,389,392,395]);const ELITES=new Set([...STARTERS,59,448]);const EEVEES=new Set([133,134,135,136,196,197,470,471]);const POS=['ST','MID','DEF','GK'];const LS='pokemon-xi-phase1-v2';
let db=[],state=null,tab='draft',selectedSlot=null,filter='',visible=48,loading=true,error='';
const $=s=>document.querySelector(s);const rand=(n)=>Math.floor(Math.random()*n);const hash=n=>((n*2654435761)>>>0);const rnd=(n,s)=>((hash(n*73+s*937)>>>0)%10000)/10000;const round=x=>Math.round(x*10)/10;const artwork=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;const img=(id,name)=>`<img loading="lazy" src="${artwork(id)}" alt="${name}" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png'">`;
function csv(text){const lines=text.trim().split(/\r?\n/);const cols=lines.shift().split(',');return lines.map(l=>{const v=l.split(',');return Object.fromEntries(cols.map((c,i)=>[c,v[i]]))})}
function buildDB(rows){const arr=rows.filter(r=>+r.id>=1&&+r.id<=493).map(r=>({id:+r.id,name:r.identifier,chain:+r.evolution_chain_id,parent:+r.evolves_from_species_id||0,region:+r.id<=151?'Kanto':+r.id<=251?'Johto':+r.id<=386?'Hoenn':'Sinnoh'}));const byId=Object.fromEntries(arr.map(p=>[p.id,p]));const byChain={};arr.forEach(p=>(byChain[p.chain]??=[]).push(p));arr.forEach(p=>{let family=byChain[p.chain].slice().sort((a,b)=>a.id-b.id);if(EEVEES.has(p.id)){p.family=p.id;p.stage=0;p.path=[p.id];p.final=p.id;return}let root=p;while(root.parent&&byId[root.parent])root=byId[root.parent];p.family=root.id;let path=[p.id],cur=p;while(cur.parent&&byId[cur.parent]){cur=byId[cur.parent];path.unshift(cur.id)}p.stage=path.length-1;const kids=family.filter(x=>x.parent===p.id);const descendants=[];const visit=x=>{descendants.push(x);family.filter(y=>y.parent===x.id).forEach(visit)};visit(p);p.final=descendants.at(-1).id;p.path=path});return arr}
async function loadDB(){let saved=localStorage.getItem('xi-pokedex');if(saved){try{db=buildDB(JSON.parse(saved));return}catch(e){}}const urls=['https://cdn.jsdelivr.net/gh/veekun/pokedex@master/pokedex/data/csv/pokemon_species.csv','https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_species.csv'];for(const u of urls){try{let r=await fetch(u);if(!r.ok)continue;let rows=csv(await r.text());if(rows.length<493)continue;localStorage.setItem('xi-pokedex',JSON.stringify(rows.filter(x=>+x.id<=493)));db=buildDB(rows);return}catch(e){}}throw Error('Pokédex data could not load. Connect to the internet and refresh. Your saved dynasty is safe.')}
function species(id){return db[id-1]}function display(id){let p=species(id);return p.name.split('-').map(s=>s[0].toUpperCase()+s.slice(1)).join(' ')}
function ratings(id){let p=species(id),elite=ELITES.has(id);let best=hash(p.family)%4;let out=POS.map((_,i)=>round(5.3+rnd(p.family,i)*2.1+(p.stage*.32)+(i===best?1.05:0)));if(elite)out[best]=round(9+rnd(id,21));return out.map(x=>Math.min(10,x))}
function future(id){let p=species(id);return ratings(p.final)}
function chemistry(roster){return roster.map((x,i)=>{let p=species(x.id);let others=roster.filter((y,j)=>j!==i);let sharedRegion=others.some(y=>species(y.id).region===p.region);let sharedStage=others.some(y=>species(y.id).stage===p.stage);let sharedType=others.some(y=>typeOf(y.id)===typeOf(x.id));return Math.min(.5,(sharedType?.2:0)+(sharedRegion?.1:0)+(sharedStage?.1:0))})}
function typeOf(id){return TYPES[hash(species(id).family)%TYPES.length]}
function score(roster){let ch=chemistry(roster);return roster.reduce((v,p,i)=>v+Math.min(10,ratings(p.id)[i<3?0:i<6?1:i<10?2:3]+ch[i]),0)}
function save(){localStorage.setItem(LS,JSON.stringify(state))}function newGame(team){let order=Array.from({length:20},(_,i)=>i);for(let i=19;i>0;i--){let j=rand(i+1);[order[i],order[j]]=[order[j],order[i]]}state={user:team,order,rosters:Array.from({length:20},()=>[]),picks:[],current:0,complete:false,year:1};save()}
function pool(){const used=new Set(state.rosters.flat().map(p=>species(p.id).family));return db.filter(p=>!used.has(p.family))}
function turnTeam(){let r=Math.floor(state.current/20),index=state.current%20;return state.order[r%2===0?index:19-index]}
function addPick(id){let team=turnTeam();if(!pool().some(p=>p.id===id))return false;state.rosters[team].push({id});state.picks.push({team,id,round:Math.floor(state.current/20)+1});state.current++;state.complete=state.current===220;save();return true}
function aiPick(){let team=turnTeam(),roster=state.rosters[team],available=pool();let strategy=team%4;let scored=available.map(p=>{let a=ratings(p.id),f=future(p.id),needed=roster.length<3?0:roster.length<6?1:roster.length<10?2:3;let potential=Math.max(...f);let value=(strategy===0?Math.max(...a):strategy===1?potential:strategy===2?a[needed]:.5*Math.max(...a)+.5*potential);value+=rnd(p.id,team)*.3;return {id:p.id,value}});scored.sort((a,b)=>b.value-a.value);addPick(scored[0].id)}
function simulateToUser(){let count=0;while(!state.complete&&turnTeam()!==state.user&&count++<220)aiPick();render()}
function skipToNext(){if(state.complete)return;let count=0;while(!state.complete&&turnTeam()!==state.user&&count++<220)aiPick();render()}
function autoDraft(){while(!state.complete){aiPick()}render()}
function pick(id){if(state.complete||turnTeam()!==state.user)return;if(addPick(id)){filter='';visible=48;simulateToUser()}}
function swap(a,b){if(a===b)return;let r=state.rosters[state.user];[r[a],r[b]]=[r[b],r[a]];save();render()}
function optimize(){let r=state.rosters[state.user];if(r.length!==11)return;let best=null,high=-1e10;for(let attempt=0;attempt<14;attempt++){let a=[...r];if(attempt){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}}let change=true;while(change){change=false;let start=score(a);for(let i=0;i<11;i++)for(let j=i+1;j<11;j++){[a[i],a[j]]=[a[j],a[i]];let s=score(a);if(s>start+.0001){start=s;change=true}else[a[i],a[j]]=[a[j],a[i]]}}let s=score(a);if(s>high){best=a;high=s}}state.rosters[state.user]=best;save();render()}
function ratingLine(id){let r=ratings(id);return POS.map((p,i)=>`${p} ${r[i].toFixed(1)}`).join(' · ')}
function nav(t){tab=t;selectedSlot=null;render()}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let app=$('#app');if(loading){app.innerHTML='<h1>Loading Pokédex…</h1>';return}if(error){app.innerHTML=`<div class="panel notice">${error}</div>`;return}if(!state){app.innerHTML=`<h1>Choose Your Club</h1><p class="muted">20 clubs · 11-round snake draft · 493 Pokémon · no captains</p><div class="grid">${CLUBS.map((c,i)=>`<div class="club" onclick="start(${i})"><img src="logo-${i+1}.png"><strong>${c}</strong></div>`).join('')}</div>`;return}if(tab==='draft')renderDraft();else if(tab==='team')renderTeam();else if(tab==='clubs')renderClubs();else renderRules()}
function renderDraft(){let app=$('#app'),mine=state.rosters[state.user],myTurn=!state.complete&&turnTeam()===state.user;let available=pool().filter(p=>display(p.id).toLowerCase().includes(filter.toLowerCase()));let cards=available.slice(0,visible);app.innerHTML=`<div class="top"><h1>DRAFT</h1><div class="muted">${CLUBS[state.user]}</div></div><div class="panel"><div class="row between"><div><b>Round ${Math.min(11,Math.floor(state.current/20)+1)} / 11</b><p class="muted">Pick ${state.current} / 220 · Your draft slot: ${state.order.indexOf(state.user)+1}</p></div><img class="team-logo" src="logo-${state.user+1}.png"></div><div class="pick">${state.complete?'Draft complete — manage your XI':myTurn?'YOUR PICK — choose a Pokémon':`On the clock: ${CLUBS[turnTeam()]}`}</div><div class="toolbar"><button class="secondary" onclick="skipToNext()" ${state.complete?'disabled':''}>Skip to My Next Pick</button><button class="secondary" onclick="autoDraft()" ${state.complete?'disabled':''}>Autodraft Remaining</button><button onclick="nav('team')">My Team (${mine.length}/11)</button></div></div><div class="panel"><h2>Available Pokémon (${available.length} shown of ${pool().length} families)</h2><input placeholder="Search Pokémon…" value="${filter.replaceAll('"','&quot;')}" oninput="filter=this.value;visible=48;renderDraft()"><p class="muted">One pick per evolutionary family. Eevee and all seven Eeveelutions are independent.</p><div class="grid">${cards.map(p=>`<div class="pokemon">${img(p.id,display(p.id))}<b>${display(p.id)}</b><small>#${String(p.id).padStart(3,'0')} · ${p.region}</small><div class="stats">${ratingLine(p.id)}</div><small>Final: ${ratingLine(p.final)}</small><button onclick="pick(${p.id})" ${myTurn?'':'disabled'}>Draft</button></div>`).join('')}</div>${visible<available.length?'<div class="toolbar"><button class="secondary" onclick="visible+=48;renderDraft()">Load More</button></div>':''}</div><div class="panel"><h2>Recent Picks</h2>${state.picks.slice(-15).reverse().map(p=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #333"><span class="muted">R${p.round}</span> ${CLUBS[p.team]} — <b>${display(p.id)}</b></div>`).join('')||'<p class="muted">No picks yet</p>'}</div>`}
function renderTeam(){let r=state.rosters[state.user],ch=chemistry(r);let slots=['ST','ST','ST','MID','MID','MID','DEF','DEF','DEF','DEF','GK'];$('#app').innerHTML=`<div class="top"><div><h1>${CLUBS[state.user]}</h1><div class="muted">${r.length===11?'Team rating '+(score(r)/11).toFixed(2):r.length+'/11 drafted'} · tap two players to swap</div></div><img class="team-logo" src="logo-${state.user+1}.png"></div><div class="toolbar"><button onclick="optimize()" ${r.length!==11?'disabled':''}>AUTO BEST XI</button><button class="secondary" onclick="nav('draft')">DRAFT</button></div><div class="field"><div class="formation">${slots.map((pos,i)=>{let p=r[i];return `<div class="slot ${i>=6&&i<10?'def':i===10?'gk':i>=3?'mid':''} ${selectedSlot===i?'selected':''}" onclick="selectSlot(${i})" draggable="${!!p}" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="event.preventDefault();dropSlot(event,${i})">${p?`${img(p.id,display(p.id))}<span><b>${display(p.id)}</b></span><span>${pos} <b class="badge">${Math.min(10,ratings(p.id)[i<3?0:i<6?1:i<10?2:3]+ch[i]).toFixed(1)}</b> <span style="display:inline;color:#6bdf8b">+${ch[i].toFixed(1)}</span></span>`:`<span class="empty">${pos}<br>Empty</span>`}</div>`}).join('')}</div></div><div class="panel"><h2>SQUAD</h2><div class="tablewrap"><table><thead><tr><th>Pokémon</th><th>Slot</th><th>ST</th><th>MID</th><th>DEF</th><th>GK</th><th>Projected final</th></tr></thead><tbody>${r.map((p,i)=>`<tr><td>${display(p.id)}<div class="muted">${species(p.id).region}</div></td><td>${slots[i]}</td>${ratings(p.id).map(x=>`<td>${x.toFixed(1)}</td>`).join('')}<td>${future(p.id).map(x=>x.toFixed(1)).join(' / ')}</td></tr>`).join('')}</tbody></table></div></div>`}
function selectSlot(i){if(selectedSlot===null){selectedSlot=i;render()}else{let a=selectedSlot;selectedSlot=null;swap(a,i)}}function dropSlot(e,i){let a=Number(e.dataTransfer.getData('text/plain'));selectedSlot=null;if(Number.isInteger(a)&&a>=0&&a<11)swap(a,i)}
function renderClubs(){$('#app').innerHTML=`<h1>20 CLUBS</h1><div class="grid">${CLUBS.map((c,i)=>`<div class="pokemon"><img style="height:100px" src="logo-${i+1}.png"><b>${c}</b><small>${state.rosters[i].length}/11 players</small><small>${state.rosters[i].map(p=>display(p.id)).join(', ')||'Awaiting draft'}</small></div>`).join('')}</div>`}
function renderRules(){$('#app').innerHTML=`<h1>PHASE ONE RULES</h1><div class="panel"><h2>Playable now</h2><p>20 clubs, official Pokémon artwork, 493 species, evolution-family uniqueness, randomized snake draft, AI picks, skip/autodraft, 11-player formation, swaps, chemistry, auto-best-XI, persistent local save.</p><h2>Ratings</h2><p>Four ratings per Pokémon. Fully evolved regional starters, Lucario, and Arcanine receive a 9.0–10.0 rating in their best position. Projected final evolution ratings are visible.</p><h2>Coming in later phases</h2><p>Season simulation, standings, playoffs, keepers, progression, trading (including draft picks three seasons ahead), free agency, and dynasty history are not implemented in this Phase 1 build.</p><p class="muted">Internet is required on first launch to load Pokédex metadata and artwork. Progress is saved in this browser's local storage.</p><button class="secondary danger" onclick="resetGame()">Reset Dynasty</button></div>`}
function start(i){newGame(i);simulateToUser()}function resetGame(){if(confirm('Delete this dynasty and restart?')){localStorage.removeItem(LS);state=null;tab='draft';render()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.tab)));
(async()=>{try{await loadDB();let saved=localStorage.getItem(LS);if(saved){try{state=JSON.parse(saved)}catch(e){}}loading=false;render()}catch(e){loading=false;error=e.message;render()}})();
</script></body></html>
