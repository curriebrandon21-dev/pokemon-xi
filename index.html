<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokémon XI Dynasty</title><style>
:root{--bg:#080b13;--panel:#141b2a;--panel2:#1b2540;--gold:#f3c65c;--text:#eef3ff;--muted:#9ba9c2;--line:#33415c;--green:#45cf91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #52617e;background:#263454;color:white;border-radius:9px;padding:10px 13px;font-weight:750}button:disabled{opacity:.4;cursor:default}.primary{background:var(--gold);color:#101525;border-color:var(--gold)}.brand{font-size:22px;color:var(--gold);font-weight:950;letter-spacing:1px}header{position:sticky;top:0;background:#0d1322;z-index:10;border-bottom:1px solid var(--line);padding:13px 12px 8px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:var(--muted)}nav{display:flex;gap:6px;overflow:auto;padding-top:12px;scrollbar-width:none}nav button{white-space:nowrap;padding:8px 11px;background:transparent;border:0;color:var(--muted)}nav button.active{color:var(--gold);border-bottom:2px solid var(--gold);border-radius:0}main{max-width:1100px;margin:auto;padding:15px 12px 50px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px}h2{margin:0 0 12px;color:var(--gold);font-size:21px}h3{margin:0 0 10px}p{line-height:1.45}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.stat{background:var(--panel2);padding:12px;border-radius:10px}.stat strong{font-size:22px;color:var(--gold);display:block}.scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:550px;font-size:13px}.table th,.table td{border-bottom:1px solid #303b52;padding:8px 5px;text-align:left}.table th{color:var(--muted)}.table tr.mine{background:#44351d}.poke{width:43px;height:43px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}.crest{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:8px;background:#243452;font-size:17px;margin-right:5px}.pitch{background:repeating-linear-gradient(90deg,#126044 0 10%,#176c4b 10% 20%);border:3px solid #e9edb8;border-radius:9px;position:relative;aspect-ratio:1.5;overflow:hidden}.pitch:before{content:"";position:absolute;inset:6%;border:2px solid #ffffff7a;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:0;height:100%;border-left:2px solid #ffffff7a;pointer-events:none}.circle{position:absolute;width:23%;aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-50%);border:2px solid #ffffff8c;border-radius:50%}.player{position:absolute;transform:translate(-50%,-50%);width:7.5%;aspect-ratio:1;z-index:2;transition:left .55s linear,top .55s linear}.player img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 2px 1px #000)}.player .dot{position:absolute;bottom:0;left:10%;right:10%;height:5px;border-radius:50%;background:#52b6ff}.player.away .dot{background:#ff7774}.ball{position:absolute;width:2.5%;aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid #171717;z-index:4;transform:translate(-50%,-50%);transition:left .55s,top .55s}.score{font-size:23px;font-weight:900;color:var(--gold)}.event{padding:7px;border-bottom:1px solid #34415a;font-size:13px}.listrow{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #33415a}.listrow .name{flex:1}.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}.lineup .slot{background:#193a2d;border:1px solid #397052;border-radius:9px;padding:5px 2px;font-size:11px}.slot img{width:45px;height:45px;object-fit:contain;image-rendering:pixelated}.tag{display:inline-block;background:#283959;border-radius:5px;padding:3px 6px;color:#d4e4ff;font-size:11px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.controls select{background:#263454;color:white;padding:8px;border:1px solid #52617e;border-radius:8px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#293955;padding:11px 17px;border-radius:9px;display:none;z-index:20;max-width:90vw}@media(max-width:550px){.brand{font-size:18px}.card{padding:11px}.pitch{aspect-ratio:1.2}.player{width:9%}.table{font-size:12px}.lineup .slot{font-size:10px}}
</style></head><body><header><div class="top"><div class="brand">⚽ POKÉMON XI DYNASTY</div><div class="small" id="seasonLabel"></div></div><nav id="nav"></nav></header><main id="app"></main><div id="toast"></div><script>
const NAMES=['Normal FC','Dynamo Fire','Racing Water','Electric City','Grass Wanderers','Ice Palace','Club Fighting','Inter Poison','Real Ground','Flying Rangers','Sporting Psychic','Bug Albion','Rock Rovers','Ghost Union','Dragon Hotspur','Dark Olympique','Steel Athletic','Fairy Town','AC Mythic','Cosmic United'];
const ICONS=['◉','🔥','🌊','⚡','🍃','❄️','🥊','☠️','⛰️','🪽','🔮','🐞','🪨','👻','🐉','🌙','⚙️','✨','🌟','🌌'];
const TYPES=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
const sprite=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),round=v=>Math.round(v*10)/10;
let db=[],state,tab='Home',viewer=null,watchTimer=null;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function save(){localStorage.setItem('pokemon_xi_dynasty_v3',JSON.stringify(state))}
function nameFor(id){return db[id-1]?.name||`Pokémon #${id}`}
function seeded(id,k){let x=Math.sin(id*93.71+k*28.3)*43758.5453;return x-Math.floor(x)}
function baseStage(id){let p=db[id-1];return !p?.evolvesFrom}
function rating(id,pos){let p=db[id-1],b=p?.ratings?.[pos]||7;let change=state?.growth?.[id]||0;return round(clamp(b+change,4.5,10))}
function createPokemon(){let arr=[];for(let id=1;id<=493;id++){let a=seeded(id,1),b=seeded(id,2),c=seeded(id,3),d=seeded(id,4);let r=[a,b,c,d].map(v=>round(6.2+v*2.5));let boost=Math.floor(seeded(id,6)*4);r[boost]=round(Math.min(9.2,r[boost]+.55));arr.push({id,name:`Pokémon #${id}`,types:[TYPES[Math.floor(seeded(id,8)*18)]],ratings:r,potential:round(8+seeded(id,9)*1.5),evolvesFrom:null})}return arr}
async function loadDex(){let cached=localStorage.getItem('xi_dex_493');if(cached){try{db=JSON.parse(cached);return}catch(e){}}db=createPokemon();render();try{let r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=493');if(!r.ok)throw Error();let data=await r.json();data.results.forEach((p,i)=>db[i].name=p.name.replace(/-/g,' '));let species=await fetch('https://pokeapi.co/api/v2/pokemon-species?limit=493');if(species.ok){let sp=await species.json();sp.results.forEach((p,i)=>{let n=p.name;let chainMap={2:1,3:2,5:4,6:5,8:7,9:8,11:10,12:11,14:13,15:14,17:16,18:17,20:19,22:21,24:23,26:25,28:27,31:30,34:33,36:35,38:37,40:39,42:41,45:44,47:46,49:48,51:50,53:52,55:54,57:56,59:58,61:60,62:61,64:63,65:64,67:66,68:67,70:69,71:70,73:72,75:74,76:75,78:77,80:79,82:81,85:84,87:86,89:88,91:90,93:92,94:93,97:96,99:98,101:100,103:102,105:104,107:106,110:109,112:111,117:116,119:118,121:120,130:129,134:133,135:133,136:133,139:138,141:140,148:147,149:148,153:152,154:153,156:155,157:156,159:158,160:159,162:161,164:163,166:165,168:167,171:170,176:175,178:177,180:179,181:180,182:44,184:183,186:61,188:187,189:188,192:191,195:194,196:133,197:133,199:79,202:201,205:204,208:95,210:209,212:123,217:216,219:218,221:220,224:223,229:228,230:117,232:231,233:137,237:236,242:113,247:246,248:247,253:252,254:253,256:255,257:256,259:258,260:259,262:261,264:263,266:265,267:266,268:265,269:268,271:270,272:271,274:273,275:274,277:276,279:278,282:281,284:283,286:285,288:287,289:288,291:290,292:290,294:293,295:294,297:296,300:299,301:300,305:304,306:305,308:307,310:309,315:314,317:316,319:318,321:320,323:322,326:325,330:329,332:331,334:333,336:335,338:337,340:339,342:341,344:343,346:345,348:347,350:349,354:353,356:355,358:357,362:361,364:363,365:364,367:366,368:366,372:371,373:372,375:374,376:375,388:387,389:388,391:390,392:391,394:393,395:394,397:396,398:397,400:399,402:401,404:403,405:404,407:406,409:408,411:410,413:412,414:412,416:415,418:417,419:418,421:420,423:422,426:425,428:427,430:198,432:431,435:434,437:436,440:113,442:441,444:443,445:444,448:447,450:449,452:451,454:453,457:456,460:459,461:215,462:82,463:108,464:112,465:114,466:125,467:126,468:176,469:193,470:133,471:133,472:207,473:221,474:233,475:281,476:299,477:356,478:361};db.forEach(p=>p.evolvesFrom=chainMap[p.id]||null);}}localStorage.setItem('xi_dex_493',JSON.stringify(db));render()}catch(e){toast('Offline Pokémon data active');render()}}
function newState(){return{season:1,phase:'draft',my:0,teams:NAMES.map((name,i)=>({name,roster:[],wins:0,draws:0,losses:0,gf:0,ga:0,points:0})),draftIndex:0,draftOrder:[],pool:[],fixtures:[],round:0,stats:{},history:[],growth:{},protected:[],tradeOffers:[]}}
function buildDraft(){state.pool=db.filter(p=>baseStage(p.id)||[133,134,135,136,196,197,470,471].includes(p.id)).map(p=>p.id);state.draftOrder=[];for(let r=0;r<11;r++)for(let i=0;i<20;i++)state.draftOrder.push(r%2?19-i:i);state.draftIndex=0;state.phase='draft';save()}
function init(){try{state=JSON.parse(localStorage.getItem('pokemon_xi_dynasty_v3'))}catch(e){}if(!state||!state.teams||state.teams.length!==20){state=newState();buildDraft()}loadDex();render()}
function currentPick(){return state.draftOrder[state.draftIndex]}
function choose(id){if(state.phase!=='draft'||currentPick()!==state.my||!state.pool.includes(id))return;draftPick(id);autoDraft();render()}
function draftPick(id){let team=currentPick();state.teams[team].roster.push(id);state.pool=state.pool.filter(x=>x!==id);state.draftIndex++;if(state.draftIndex>=state.draftOrder.length){state.phase='season';createSchedule()}save()}
function autoDraft(){while(state.phase==='draft'&&currentPick()!==state.my){let team=state.teams[currentPick()],needs=[0,0,0,0];team.roster.forEach(id=>needs[bestPos(id)]++);let order=state.pool.slice().sort((a,b)=>{let val=id=>Math.max(...[0,1,2,3].map(pos=>rating(id,pos)+(needs[pos]<[3,3,4,1][pos]?0.45:0)))+db[id-1].potential*.1;return val(b)-val(a)});let top=order.slice(0,Math.min(9,order.length));draftPick(top[Math.floor(Math.random()*top.length)])}save()}
function bestPos(id){return [0,1,2,3].reduce((a,b)=>rating(id,b)>rating(id,a)?b:a,0)}
function formation(roster){let available=roster.slice(),out=[];for(let pos of [3,2,2,2,2,1,1,1,0,0,0]){if(!available.length)break;available.sort((a,b)=>rating(b,pos)-rating(a,pos));out.push({id:available.shift(),pos})}return out}
function strength(t){let f=formation(t.roster);return f.reduce((s,p)=>s+rating(p.id,p.pos),0)/Math.max(1,f.length)}
function createSchedule(){let ids=Array.from({length:20},(_,i)=>i),first=[];for(let r=0;r<19;r++){let matches=[];for(let i=0;i<10;i++){let a=ids[i],b=ids[19-i];matches.push(r%2?[b,a]:[a,b])}first.push(matches);ids=[ids[0],ids[19],...ids.slice(1,19)]}state.fixtures=[...first,...first.map(round=>round.map(([a,b])=>[b,a]))].map((games,i)=>({round:i+1,games:games.map(([home,away])=>({home,away,score:null}))}));state.round=0;state.teams.forEach(t=>Object.assign(t,{wins:0,draws:0,losses:0,gf:0,ga:0,points:0}));state.stats={};save()}
function poisson(l){let p=Math.exp(-l),n=0,s=1;do{n++;s*=Math.random()}while(s>p&&n<9);return n-1}
function makeResult(a,b){let x=strength(state.teams[a]),y=strength(state.teams[b]);let lambdaA=clamp(1.13+(x-y)*.3+.17,.25,2.5),lambdaB=clamp(1.13+(y-x)*.3,.25,2.5);let ga=poisson(lambdaA),gb=poisson(lambdaB);let events=[];function score(team,num){let players=formation(state.teams[team].roster).filter(p=>p.pos!==3);for(let i=0;i<num;i++){let weights=players.map(p=>p.pos===0?5:p.pos===1?2.5:.6),sum=weights.reduce((a,b)=>a+b,0),v=Math.random()*sum,idx=0;while(idx<weights.length-1&&v>weights[idx])v-=weights[idx++];let scorer=players[idx]?.id,minute=Math.floor(rand(3,91));events.push({minute,team,scorer,type:'goal'});if(scorer){state.stats[scorer]??={goals:0,assists:0,apps:0};state.stats[scorer].goals++}if(players.length>1&&Math.random()<.73){let other=players.filter(p=>p.id!==scorer),assist=other[Math.floor(Math.random()*other.length)]?.id;if(assist){state.stats[assist]??={goals:0,assists:0,apps:0};state.stats[assist].assists++;events[events.length-1].assist=assist}}}}score(a,ga);score(b,gb);events.sort((x,y)=>x.minute-y.minute);return{ga,gb,events}}
function applyResult(g,res){g.score=[res.ga,res.gb];g.events=res.events;let a=state.teams[g.home],b=state.teams[g.away];a.gf+=res.ga;a.ga+=res.gb;b.gf+=res.gb;b.ga+=res.ga;if(res.ga>res.gb){a.wins++;a.points+=3;b.losses++}else if(res.ga<res.gb){b.wins++;b.points+=3;a.losses++}else{a.draws++;b.draws++;a.points++;b.points++}for(let t of [a,b])for(let id of t.roster){state.stats[id]??={goals:0,assists:0,apps:0};state.stats[id].apps++}save()}
function nextRound(){if(state.phase!=='season'||state.round>=38)return;let round=state.fixtures[state.round];round.games.forEach(g=>{if(!g.score)applyResult(g,makeResult(g.home,g.away))});state.round++;if(state.round===38)state.phase='playoffs';save();render()}
function startWatch(){if(state.phase!=='season')return;let g=state.fixtures[state.round]?.games.find(g=>g.home===state.my||g.away===state.my);if(!g||g.score)return;let res=makeResult(g.home,g.away);viewer={g,res,minute:0,speed:1,done:false,positions:[],eventIndex:0,display:[0,0],log:[]};let a=formation(state.teams[g.home].roster),b=formation(state.teams[g.away].roster);viewer.positions=[...a.map((p,i)=>({id:p.id,side:0,x:15+(i%4)*7,y:12+Math.floor(i/4)*28})),...b.map((p,i)=>({id:p.id,side:1,x:85-(i%4)*7,y:12+Math.floor(i/4)*28}))];tab='Watch';render();clearInterval(watchTimer);watchTimer=setInterval(tick,650)}
function tick(){if(!viewer||viewer.done){clearInterval(watchTimer);return}viewer.minute=Math.min(90,viewer.minute+viewer.speed);viewer.positions.forEach((p,i)=>{let base=p.side===0?33:67;p.x=clamp(p.x*.65+base*.35+rand(-9,9),5,95);p.y=clamp(p.y+rand(-12,12),7,93)});while(viewer.eventIndex<viewer.res.events.length&&viewer.res.events[viewer.eventIndex].minute<=viewer.minute){let e=viewer.res.events[viewer.eventIndex++];viewer.display[e.team===viewer.g.home?0:1]++;viewer.log.unshift(`${e.minute}' ⚽ ${nameFor(e.scorer)} (${state.teams[e.team].name})`)}if(viewer.minute>=90)finishWatch();else drawViewer()}
function finishWatch(){if(!viewer||viewer.done)return;viewer.minute=90;viewer.display=[viewer.res.ga,viewer.res.gb];viewer.done=true;clearInterval(watchTimer);applyResult(viewer.g,viewer.res);let round=state.fixtures[state.round];round.games.filter(g=>!g.score).forEach(g=>applyResult(g,makeResult(g.home,g.away)));state.round++;if(state.round>=38)state.phase='playoffs';save();render()}
function club(i){return `<span class="crest">${ICONS[i]}</span>${NAMES[i]}`}
function spriteTag(id){return `<img class="poke" src="${sprite(id)}" loading="lazy" onerror="this.style.opacity='.15'">`}
function render(){document.getElementById('seasonLabel').textContent=`Season ${state.season} · ${state.phase.toUpperCase()}`;let tabs=['Home','Draft','My Team','Schedule','Table','Watch','Stats','Trades','History'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');let views={Home:home,Draft:draftView,'My Team':teamView,Schedule:scheduleView,Table:tableView,Watch:watchView,Stats:statsView,Trades:tradesView,History:historyView};document.getElementById('app').innerHTML=views[tab]();if(tab==='Watch')drawViewer();if(tab==='Trades')renderTradeTargets()}
function setTab(t){tab=t;render()}
function home(){let t=state.teams[state.my];return `<div class="card"><h2>${club(state.my)} · Season ${state.season}</h2><p class="muted">Build your Pokémon XI. Draft, manage, compete, and watch your games in pixel-art.</p><div class="grid"><div class="stat">Squad<strong>${t.roster.length}/11</strong></div><div class="stat">Record<strong>${t.wins}-${t.draws}-${t.losses}</strong></div><div class="stat">Points<strong>${t.points}</strong></div><div class="stat">Round<strong>${state.round}/38</strong></div></div></div><div class="card"><h3>Choose your club</h3>${state.phase==='draft'&&state.draftIndex===0?`<select onchange="state.my=+this.value;save();render()" style="padding:9px;background:#263454;color:white;border-radius:8px">${NAMES.map((n,i)=>`<option value="${i}" ${state.my===i?'selected':''}>${n}</option>`).join('')}</select>`:''}<h3 style="margin-top:15px">Next action</h3>${state.phase==='draft'?`<p>Pick ${state.draftIndex+1} of 220 · ${t.roster.length} Pokémon drafted</p><button class="primary" onclick="setTab('Draft')">Open Draft →</button>`:state.phase==='season'?`<p>Round ${state.round+1} of 38</p><div class="row"><button class="primary" onclick="startWatch()">▶ Watch My Match</button><button onclick="nextRound()">Simulate Round</button></div>`:state.phase==='playoffs'?`<p>Regular season complete. Start the top-six playoffs.</p><button class="primary" onclick="runPlayoffs()">Play Playoffs</button>`:`<button class="primary" onclick="startOffseason()">Begin Next Season</button>`}</div><div class="card"><h3>Game guide</h3><p>Choose your starting XI, follow your team live, then advance the dynasty. Progress saves automatically on this device.</p><button onclick="if(confirm('Erase current save and start again?')){localStorage.removeItem('pokemon_xi_dynasty_v3');location.reload()}">New Dynasty / Reset</button></div>`}
function draftView(){if(state.phase!=='draft')return `<div class="card"><h2>Draft complete</h2><p>The next offseason draft begins after the championship.</p></div>`;let turn=currentPick(),items=state.pool.slice().sort((a,b)=>Math.max(...db[b-1].ratings)-Math.max(...db[a-1].ratings));let filter=window.draftSearch||'';items=items.filter(id=>nameFor(id).includes(filter.toLowerCase())||String(id)===filter).slice(0,70);return `<div class="card"><h2>Round ${Math.floor(state.draftIndex/20)+1} · Pick ${state.draftIndex+1}/${state.draftOrder.length}</h2><p>On the clock: <b>${club(turn)}</b></p><p class="small">Each team drafts 11 unique Pokémon. No substitutes.</p><div class="row"><input placeholder="Search Pokémon" value="${filter}" oninput="window.draftSearch=this.value;render()" style="padding:9px;background:#263454;color:white;border:1px solid #52617e;border-radius:7px;max-width:170px"><button onclick="autoDraft();render()">Advance CPU picks</button></div></div><div class="card"><h3>Available Pokémon (${state.pool.length})</h3>${items.map(id=>`<div class="listrow">${spriteTag(id)}<span class="name"><b>${nameFor(id)}</b><br><span class="small">#${id} · Best ${Math.max(...db[id-1].ratings).toFixed(1)}</span></span><button class="primary" ${turn!==state.my?'disabled':''} onclick="choose(${id})">Draft</button></div>`).join('')}</div>`}
function teamView(){let t=state.teams[state.my],f=formation(t.roster);return `<div class="card"><div class="row between"><h2>${club(state.my)}</h2><button onclick="toast('Best XI selected automatically')">Auto Best XI</button></div><p class="muted">Team strength ${round(strength(t))} · ${t.roster.length} Pokémon</p><div class="lineup">${f.map(p=>`<div class="slot">${spriteTag(p.id)}<div>${nameFor(p.id)}</div><b>${['ST','MID','DEF','GK'][p.pos]} ${rating(p.id,p.pos)}</b></div>`).join('')}</div></div><div class="card"><h3>Squad</h3>${t.roster.map(id=>`<div class="listrow">${spriteTag(id)}<span class="name">${nameFor(id)}</span><span class="tag">${['ST','MID','DEF','GK'][bestPos(id)]}</span><b>${Math.max(...[0,1,2,3].map(pos=>rating(id,pos)))}</b></div>`).join('')}</div>`}
function scheduleView(){return `<div class="card"><h2>Season ${state.season} Schedule</h2><p class="small">Round ${state.round}/38</p><div class="row"><button class="primary" ${state.phase!=='season'?'disabled':''} onclick="startWatch()">▶ Watch My Match</button><button ${state.phase!=='season'?'disabled':''} onclick="nextRound()">Simulate Next Round</button></div></div>${state.fixtures.slice(Math.max(0,state.round-1),Math.min(38,state.round+3)).map(r=>`<div class="card"><h3>Round ${r.round}</h3>${r.games.map(g=>`<div class="listrow" style="${g.home===state.my||g.away===state.my?'background:#38301e':''}"><span class="name">${ICONS[g.home]} ${NAMES[g.home]}</span><b>${g.score?g.score.join('–'):'vs'}</b><span class="name" style="text-align:right">${NAMES[g.away]} ${ICONS[g.away]}</span></div>`).join('')}</div>`).join('')}`}
function sortedTeams(){return state.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function tableView(){return `<div class="card"><h2>Season ${state.season} Table</h2><div class="scroll"><table class="table"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>${sortedTeams().map((t,i)=>`<tr class="${t.i===state.my?'mine':''}"><td>${i+1}</td><td>${club(t.i)}</td><td>${t.wins+t.draws+t.losses}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${t.points}</b></td></tr>`).join('')}</table></div><p class="small">Top six qualify · Seeds 1–2 receive a bye</p></div>`}
function watchView(){if(!viewer)return `<div class="card"><h2>Live Match Viewer</h2><p>Watch your team play on a retro pixel-style soccer field. Draft your team first, then select Watch My Match.</p><button class="primary" onclick="setTab('Home')">Back to Dashboard</button></div>`;let v=viewer;return `<div class="card"><div class="row between"><span>${ICONS[v.g.home]} ${NAMES[v.g.home]}</span><span class="score" id="liveScore">${v.display.join(' – ')}</span><span>${NAMES[v.g.away]} ${ICONS[v.g.away]}</span></div><div style="text-align:center;margin:8px" id="liveMinute">${v.minute}' / 90'</div><div class="pitch" id="pitch"><div class="circle"></div>${v.positions.map((p,i)=>`<div id="p${i}" class="player ${p.side?'away':''}" style="left:${p.x}%;top:${p.y}%"><img src="${sprite(p.id)}"><div class="dot"></div></div>`).join('')}<div class="ball" id="ball" style="left:50%;top:50%"></div></div><div class="controls"><button onclick="if(viewer)viewer.speed=1">1×</button><button onclick="if(viewer)viewer.speed=2">2×</button><button onclick="if(viewer)viewer.speed=5">5×</button><button class="primary" ${v.done?'disabled':''} onclick="finishWatch()">Skip to Final</button></div><h3>${v.done?'Full Time':'Live Commentary'}</h3><div id="liveLog">${v.log.map(x=>`<div class="event">${x}</div>`).join('')||'<p class="muted">Kickoff!</p>'}</div>${v.done?'<button onclick="setTab(\'Schedule\')">View Schedule →</button>':''}</div>`}
function drawViewer(){if(!viewer||tab!=='Watch')return;let v=viewer;let sc=document.getElementById('liveScore');if(!sc)return;sc.textContent=v.display.join(' – ');document.getElementById('liveMinute').textContent=`${v.minute}' / 90'`;v.positions.forEach((p,i)=>{let e=document.getElementById('p'+i);if(e){e.style.left=p.x+'%';e.style.top=p.y+'%'}});let carrier=v.positions[Math.floor(Math.random()*v.positions.length)];let ball=document.getElementById('ball');if(ball&&carrier){ball.style.left=carrier.x+'%';ball.style.top=carrier.y+'%'}document.getElementById('liveLog').innerHTML=v.log.map(x=>`<div class="event">${x}</div>`).join('')||'<p class="muted">Match in progress…</p>'}
function statsView(){let items=Object.entries(state.stats).map(([id,s])=>({id:+id,...s})).sort((a,b)=>b.goals-a.goals).slice(0,30);return `<div class="card"><h2>Season ${state.season} Scoring Leaders</h2>${items.length?items.map((s,i)=>`<div class="listrow"><b>${i+1}.</b>${spriteTag(s.id)}<span class="name">${nameFor(s.id)}</span><b>${s.goals} G</b><span class="tag">${s.assists} A</span></div>`).join(''):'Play matches to generate statistics.'}</div>`}
function tradesView(){return `<div class="card"><h2>Trades</h2><p>Propose a one-for-one Pokémon trade. The computer considers positional strength and team needs.</p><div class="controls"><select id="tradeMine">${state.teams[state.my].roster.map(id=>`<option value="${id}">${nameFor(id)}</option>`).join('')}</select><select id="tradeTeam" onchange="renderTradeTargets()">${NAMES.map((n,i)=>i===state.my?'':`<option value="${i}">${n}</option>`).join('')}</select><select id="tradeTarget"></select><button class="primary" onclick="proposeTrade()">Offer Trade</button></div><p class="small">Offseason trades and draft-pick exchanges are planned for a later update.</p></div>`}
function renderTradeTargets(){let e=document.getElementById('tradeTeam'),out=document.getElementById('tradeTarget');if(!e||!out)return;out.innerHTML=state.teams[+e.value].roster.map(id=>`<option value="${id}">${nameFor(id)}</option>`).join('')}
function proposeTrade(){let a=+document.getElementById('tradeMine').value,b=+document.getElementById('tradeTarget').value,t=+document.getElementById('tradeTeam').value;if(!a||!b)return toast('Select both players');if(Math.max(...db[a-1].ratings)+.5<Math.max(...db[b-1].ratings))return toast('Trade rejected: insufficient value');state.teams[state.my].roster=state.teams[state.my].roster.map(x=>x===a?b:x);state.teams[t].roster=state.teams[t].roster.map(x=>x===b?a:x);save();toast('Trade accepted!');render()}
function historyView(){return `<div class="card"><h2>Dynasty History</h2>${state.history.length?state.history.map(h=>`<p>Season ${h.season}: 🏆 ${NAMES[h.winner]}</p>`).join(''):'Your dynasty history starts after the first championship.'}</div>`}
function runPlayoffs(){let seeds=sortedTeams().slice(0,6).map(t=>t.i);function series(a,b){let w=[0,0];while(Math.max(...w)<2){let r=makeResult(a,b),x=r.ga,y=r.gb;if(x===y){Math.random()<.5?x++:y++}w[x>y?0:1]++}return w[0]>w[1]?a:b}let q1=series(seeds[2],seeds[5]),q2=series(seeds[3],seeds[4]);let lower=seeds.indexOf(q1)>seeds.indexOf(q2)?q1:q2,other=lower===q1?q2:q1;let s1=series(seeds[0],lower),s2=series(seeds[1],other),winner=series(s1,s2);state.history.push({season:state.season,winner});state.phase='offseason';save();toast(`${NAMES[winner]} win the championship!`);render()}
function startOffseason(){state.season++;for(let t of state.teams){t.roster=t.roster.sort((a,b)=>Math.max(...db[b-1].ratings)-Math.max(...db[a-1].ratings)).slice(0,5)}for(let t of state.teams)for(let id of t.roster)state.growth[id]=round(clamp((state.growth[id]||0)+rand(-.12,.23),-.8,1.3));let taken=new Set(state.teams.flatMap(t=>t.roster));let pool=db.filter(p=>!taken.has(p.id)&&(baseStage(p.id)||[133,134,135,136,196,197,470,471].includes(p.id))).map(p=>p.id);state.pool=pool;state.draftOrder=[];let order=sortedTeams().reverse().map(t=>t.i);for(let r=0;r<6;r++)state.draftOrder.push(...(r%2?[...order].reverse():order));state.draftIndex=0;state.phase='draft';state.fixtures=[];save();toast('New season draft started');render()}
init();setTimeout(()=>{if(tab==='Trades')renderTradeTargets()},50);
</script></body></html>
