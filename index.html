function sortedTeams(){return state.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
let tableScope='season';function tableView(){ensureRecords();let all=tableScope==='all';let list=all?state.allTeams.map((t,i)=>({...t,i})).sort((a,b)=>b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)):sortedTeams();return `<div class="card"><h2>${all?'All-Time':'Season '+state.season} Standings</h2><div class="controls"><button class="${!all?'primary':''}" onclick="tableScope='season';render()">Current Season</button><button class="${all?'primary':''}" onclick="tableScope='all';render()">All Time</button></div><div class="scroll"><table class="table"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>${all?'<th>🏆</th>':''}</tr>${list.map((t,i)=>`<tr class="${t.i===state.my?'mine':''}"><td>${i+1}</td><td>${club(t.i)}</td><td>${t.wins+t.draws+t.losses}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${t.points}</b></td>${all?`<td>${t.championships||0}</td>`:''}</tr>`).join('')}</table></div></div>`}
function gameDayView(){let g=state.phase==='season'?state.fixtures[state.round]?.games.find(g=>g.home===state.my||g.away===state.my):null;let last=state.lastMatch;let heading=`<div class="card"><h2>⚽ GAME DAY</h2><p class="muted">Season ${state.season} · ${g?'Matchday '+(state.round+1):'Matchday complete'}</p></div>`;if(viewer){let v=viewer;return heading+`<div class="card"><div class="row between"><span>${ICONS[v.g.home]} ${NAMES[v.g.home]}</span><span class="score" id="liveScore">${v.display.join(' – ')}</span><span>${NAMES[v.g.away]} ${ICONS[v.g.away]}</span></div><div style="text-align:center;margin:8px" id="liveMinute">${Math.floor(v.minute)}' / 90'</div><div class="pitch" id="pitch"><div class="circle"></div>${v.positions.map((p,i)=>`<div id="p${i}" class="player ${p.side?'away':''}" style="left:${p.x}%;top:${p.y}%">${imageHTML(p.id,'match-sprite')}<div class="dot"></div></div>`).join('')}<div class="ball" id="ball" style="left:50%;top:50%"></div></div><div class="controls"><button onclick="if(viewer)viewer.speed=1">1× · 30 sec</button><button onclick="if(viewer)viewer.speed=2">2×</button><button class="primary" ${v.done?'disabled':''} onclick="finishWatch()">Skip to Final</button></div><h3>${v.done?'FULL TIME':'Live Goal Commentary'}</h3><div id="liveLog">${v.log.map(x=>`<div class="event">${x}</div>`).join('')||'<p class="muted">Kickoff!</p>'}</div>${v.done?'<button onclick="viewer=null;render()">Next Matchday →</button>':''}</div>`}return heading+(g?`<div class="card"><div class="row between"><b>${club(g.home)}</b><span class="score">VS</span><b>${club(g.away)}</b></div><p class="muted">Home rating: ${strength(state.teams[g.home]).toFixed(2)} · Away rating: ${strength(state.teams[g.away]).toFixed(2)}</p><div class="controls"><button class="primary" onclick="startWatch()">▶ Watch 30-Second Match</button><button onclick="nextRound()">⚡ Quick Sim & Final Score</button></div><p class="small">Both modes calculate a single match result and update the league once.</p></div>`:'')+(last?`<div class="card"><h3>🏁 Last Result · Round ${last.round}</h3><div class="row between"><b>${club(last.home)}</b><span class="score">${last.score.join(' – ')}</span><b>${club(last.away)}</b></div><h3 style="margin-top:15px">Goalscorers</h3>${(last.events||[]).length?last.events.map(e=>`<div class="event">${e.minute}' ⚽ ${nameFor(e.scorer)} · ${NAMES[e.team]}${e.assist?' (assist: '+nameFor(e.assist)+')':''}</div>`).join(''):'<p class="muted">No goals scored · Clean sheet</p>'}</div>`:'')}

function drawViewer(){if(!viewer||tab!=='Game Day')return;let v=viewer;let sc=document.getElementById('liveScore');if(!sc)return;sc.textContent=v.display.join(' – ');document.getElementById('liveMinute').textContent=`${Math.floor(v.minute)}' / 90'`;v.positions.forEach((p,i)=>{let e=document.getElementById('p'+i);if(e){e.style.left=p.x+'%';e.style.top=p.y+'%'}});let ball=document.getElementById('ball');if(ball){ball.style.left=(v.ballX??50)+'%';ball.style.top=(v.ballY??50)+'%'}document.getElementById('liveLog').innerHTML=v.log.map(x=>`<div class="event">${x}</div>`).join('')||'<p class="muted">Match in progress…</p>'}
let statsScope='season',statsMetric='goals';function statsView(){ensureRecords();let all=statsScope==='all',source=all?state.allStats:state.stats;let items=Object.entries(source).map(([id,v])=>({id:+id,...v})).sort((a,b)=>(statsMetric==='points'?(b.goals||0)+(b.assists||0):(b[statsMetric]||0))-(statsMetric==='points'?(a.goals||0)+(a.assists||0):(a[statsMetric]||0))).slice(0,50);return `<div class="card"><h2>${all?'All-Time':'Season '+state.season} Player Statistics</h2><div class="controls"><button class="${!all?'primary':''}" onclick="statsScope='season';render()">Current Season</button><button class="${all?'primary':''}" onclick="statsScope='all';render()">All Time</button></div><div class="controls">${[['goals','Goals'],['assists','Assists'],['points','Points'],['saves','Saves'],['wins','Wins'],['championships','Championships']].map(([k,n])=>`<button class="${statsMetric===k?'primary':''}" onclick="statsMetric='${k}';render()">${n}</button>`).join('')}</div>${items.length?items.map((v,i)=>`<div class="listrow"><b>${i+1}.</b>${spriteTag(v.id)}<span class="name">${nameFor(v.id)}</span><b>${statsMetric==='points'?(v.goals||0)+(v.assists||0):(v[statsMetric]||0)}</b></div>`).join(''):'Play matches to generate statistics.'}</div>`}
function pickKey(year,round,origin){return `${year}:${round}:${origin}`}
function pickOwner(year,round,origin){return state.pickOwners?.[pickKey(year,round,origin)]??origin}
function pickAssets(owner){let out=[];for(let year=state.season+1;year<=state.season+3;year++)for(let r=1;r<=6;r++)for(let origin=0;origin<20;origin++)if(pickOwner(year,r,origin)===owner)out.push({year,round:r,origin,key:pickKey(year,r,origin)});return out}
function pickValue(p){let delay=p.year-state.season;let standings=sortedTeams();let rank=standings.findIndex(t=>t.i===p.origin);let base=[0,1.65,1.22,.92,.70,.53,.40][p.round];let positionFactor=1.2-(rank/19)*.36;return round(base*positionFactor*Math.pow(.87,delay-1))}
function playerValue(id){let p=db[id-1];if(!p)return 0;let top=Math.max(...[0,1,2,3].map(pos=>rating(id,pos)));return round(Math.max(.3,(top-5.5)*1.55+(p.potential-8)*.7))}
function tradeAssets(team){return state.teams[team].roster.map(id=>({key:'p'+id,label:`${nameFor(id)} · ${playerValue(id).toFixed(1)}`,value:playerValue(id),type:'player',id})).concat(pickAssets(team).map(p=>({key:'d'+p.key,label:`S${p.year} R${p.round} (${NAMES[p.origin]}) · ${pickValue(p).toFixed(1)}`,value:pickValue(p),type:'pick',...p})))}
function tradeAssetList(team,side){let assets=tradeAssets(team);return assets.map(a=>`<label class="listrow"><input type="checkbox" class="trade-${side}" value="${a.key}" onchange="tradeTotals()"><span class="name">${a.label}</span><span class="tag">${a.type==='pick'?'PICK':'PLAYER'}</span></label>`).join('')||'<p class="muted">No assets available.</p>'}
function tradesView(){let other=state.tradeTarget??(state.my===0?1:0);if(other===state.my)other=(state.my+1)%20;return `<div class="card"><h2>Trade Centre</h2><p class="small">Trade any number of Pokémon and draft picks up to three seasons ahead. Each offseason has six rounds because teams retain five Pokémon.</p><div class="row"><b>Your club: ${NAMES[state.my]}</b><span class="muted">Trade with</span><select id="tradeTeam" onchange="state.tradeTarget=+this.value;render()" style="background:#263454;color:white;padding:9px;border-radius:8px">${NAMES.map((n,i)=>i===state.my?'':`<option value="${i}" ${i===other?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><div class="card"><h3>You send</h3><div style="max-height:390px;overflow:auto">${tradeAssetList(state.my,'out')}</div></div><div class="card"><h3>You receive</h3><div style="max-height:390px;overflow:auto">${tradeAssetList(other,'in')}</div></div></div><div class="card"><div id="tradeValues" class="row between"><b>Offer value: 0</b><b>Return value: 0</b></div><p class="small">Pick values are deliberately modest. Earlier rounds and picks from struggling clubs are worth more, but established players remain the most valuable assets. CPU teams reject lopsided deals.</p><button class="primary" onclick="proposeTrade()">Propose Trade</button></div>`}
function selectedTrade(side,team){let assets=tradeAssets(team),chosen=new Set([...document.querySelectorAll('.trade-'+side+':checked')].map(el=>el.value));return assets.filter(a=>chosen.has(a.key))}
function tradeTotals(){let other=+(document.getElementById('tradeTeam')?.value??1),out=selectedTrade('out',state.my),incoming=selectedTrade('in',other);let a=out.reduce((n,x)=>n+x.value,0),b=incoming.reduce((n,x)=>n+x.value,0);let el=document.getElementById('tradeValues');if(el)el.innerHTML=`<b>Offer: ${a.toFixed(1)}</b><b>Return: ${b.toFixed(1)}</b>`}
function proposeTrade(){let other=+document.getElementById('tradeTeam').value,out=selectedTrade('out',state.my),incoming=selectedTrade('in',other);if(!out.length||!incoming.length)return toast('Both teams must offer an asset');let give=out.filter(a=>a.type==='player'),get=incoming.filter(a=>a.type==='player');let cap=state.phase==='season'?11:state.phase==='draft'?(state.season===1?11:11):11;let myCount=state.teams[state.my].roster.length-give.length+get.length,otherCount=state.teams[other].roster.length-get.length+give.length;if(myCount>cap||otherCount>cap)return toast('Trade would exceed an 11-Pokémon roster');let offered=out.reduce((n,a)=>n+a.value,0),wanted=incoming.reduce((n,a)=>n+a.value,0);if(offered+0.15<wanted*.94)return toast('CPU rejected: offer value too low');let mine=state.teams[state.my],cpu=state.teams[other];let giveIds=new Set(give.map(a=>a.id)),getIds=new Set(get.map(a=>a.id));mine.roster=mine.roster.filter(id=>!giveIds.has(id)).concat(get.map(a=>a.id));cpu.roster=cpu.roster.filter(id=>!getIds.has(id)).concat(give.map(a=>a.id));for(let a of out.filter(a=>a.type==='pick'))state.pickOwners[a.key]=other;for(let a of incoming.filter(a=>a.type==='pick'))state.pickOwners[a.key]=state.my;state.lineup=null;save();toast('Trade accepted!');render()}
function historyView(){return `<div class="card"><h2>Dynasty History</h2>${state.history.length?state.history.map(h=>`<p>Season ${h.season}: 🏆 ${NAMES[h.winner]}</p>`).join(''):'Your dynasty history starts after the first championship.'}</div>`}
function runPlayoffs(){let seeds=sortedTeams().slice(0,6).map(t=>t.i);function series(a,b){let w=[0,0];while(Math.max(...w)<2){let r=makeResult(a,b),x=r.ga,y=r.gb;if(x===y){Math.random()<.5?x++:y++}w[x>y?0:1]++}return w[0]>w[1]?a:b}let q1=series(seeds[2],seeds[5]),q2=series(seeds[3],seeds[4]);let lower=seeds.indexOf(q1)>seeds.indexOf(q2)?q1:q2,other=lower===q1?q2:q1;let s1=series(seeds[0],lower),s2=series(seeds[1],other),winner=series(s1,s2);ensureRecords();state.history.push({season:state.season,winner});state.allTeams[winner].championships++;for(let id of state.teams[winner].roster)addStat(id,'championships');state.phase='offseason';save();toast(`${NAMES[winner]} win the championship!`);render()}
function startOffseason(){state.season++;for(let t of state.teams){t.roster=t.roster.sort((a,b)=>Math.max(...db[b-1].ratings)-Math.max(...db[a-1].ratings)).slice(0,5)}for(let t of state.teams)for(let id of t.roster)state.growth[id]=round(clamp((state.growth[id]||0)+rand(-.12,.23),-.8,1.3));let taken=new Set(state.teams.flatMap(t=>t.roster));let pool=db.filter(p=>!taken.has(p.id)&&(baseStage(p.id))).map(p=>p.id);state.pool=pool;state.draftOrder=[];let order=sortedTeams().reverse().map(t=>t.i);for(let r=0;r<6;r++){let sequence=r%2?[...order].reverse():order;for(let origin of sequence)state.draftOrder.push(pickOwner(state.season,r+1,origin));}state.draftIndex=0;state.phase='draft';state.lineup=null;state.fixtures=[];save();toast('New season draft started');render()}
try{init()}catch(error){console.error('Pokémon XI startup error:',error);document.getElementById('app').innerHTML='<div class="card"><h2>Game startup error</h2><p>Saved data or an older game version may be incompatible.</p><button class="primary" onclick="localStorage.removeItem(\'pokemon_xi_dynasty_v3\');localStorage.removeItem(\'xi_dex_493\');location.reload()">Repair and Start Fresh</button><p class="small">This resets the local game save.</p></div>'}
setTimeout(()=>{if(tab==='Trades')tradeTotals()},50);
</script></body></html>
