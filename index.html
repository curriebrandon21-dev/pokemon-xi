function simWeek(){if(game.phase!=='season')return;for(const f of game.fixtures.filter(x=>x.week===game.week+1&&!x.score)){f.report=simMatch(f.home,f.away);f.score=f.report.score}game.week++;if(game.week===38){game.phase='playoffs';beginPlayoffs()}save();render()}function simRest(){while(game.phase==='season')simWeek()}
function standings(){let rows=game.teams.map(t=>({id:t.id,name:t.name,w:0,d:0,l:0,gf:0,ga:0,pts:0,ovr:strength(t)}));for(const f of game.fixtures||[]){if(!f.score)continue;let [x,y]=f.score,a=rows[f.home],b=rows[f.away];a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;if(x>y){a.w++;b.l++;a.pts+=3}else if(y>x){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function beginPlayoffs(){let seeds=standings().slice(0,8).map(t=>t.id);game.seeds=seeds;game.playoffRound=0;game.playoffs=[{round:0,series:[[seeds[0],seeds[7]],[seeds[1],seeds[6]],[seeds[2],seeds[5]],[seeds[3],seeds[4]]].map(([a,b])=>({a,b,wins:[0,0],games:[]}))}]}function simPlayoffGame(){if(game.phase!=='playoffs')return;let round=game.playoffs[game.playoffRound],series=round.series.find(s=>Math.max(...s.wins)<4);if(!series){advancePlayoffs();return}let n=series.games.length,home=[0,0,1,1,0,1,0][n]===0?series.a:series.b,away=home===series.a?series.b:series.a,r=simMatch(home,away,true);series.games.push(r);series.wins[r.score[0]>r.score[1]?(home===series.a?0:1):(away===series.a?0:1)]++;if(round.series.every(s=>Math.max(...s.wins)===4))advancePlayoffs();save();render()}function advancePlayoffs(){let round=game.playoffs[game.playoffRound],winners=round.series.map(s=>s.wins[0]===4?s.a:s.b);if(winners.length===1){game.champion=winners[0];game.phase='recap';completeSeason();return}winners.sort((a,b)=>game.seeds.indexOf(a)-game.seeds.indexOf(b));let next=[];while(winners.length>=2)next.push({a:winners.shift(),b:winners.pop(),wins:[0,0],games:[]});game.playoffRound++;game.playoffs.push({round:game.playoffRound,series:next})}function simPlayoffs(){let n=0;while(game.phase==='playoffs'&&n++<150)simPlayoffGame()}
function totals(p,mode){if(mode==='career')return p.career;let key=`${game.year}-${mode}`;return p.stats[key]||blank()}function leaders(key,mode='season'){return Object.values(game.players).filter(p=>p.career.gp>0).sort((a,b)=>totals(b,mode)[key]-totals(a,mode)[key]).slice(0,10)}
function completeSeason(){let table=standings(),winner=team(game.champion);winner.titles++;let top=leaders('g')[0],assists=leaders('a')[0],keeper=leaders('cs')[0];let awards=[['Golden Boot',top?.uid],['Assist Leader',assists?.uid],['Best Goalkeeper',keeper?.uid],['League MVP',top?.uid]];for(const [title,uid] of awards)if(uid)player(uid).awards.push({year:game.year,title});let archive={year:game.year,champion:game.champion,runnerUp:game.playoffs.at(-1).series[0].a===game.champion?game.playoffs.at(-1).series[0].b:game.playoffs.at(-1).series[0].a,table,awards,draft:game.draftLog.filter(x=>x.year===game.year),trades:game.trades.filter(x=>x.year===game.year)};game.archives.push(archive);for(const t of game.teams)t.history.push({year:game.year,finish:table.findIndex(x=>x.id===t.id)+1,champion:t.id===game.champion});game.recap=archive}
function startKeepers(){game.phase='keepers';for(const t of game.teams){t.keepers=[];if(t.id!==game.user)autoKeep(t)}save();render()}function autoKeep(t){t.keepers=[...t.roster].sort((a,b)=>needScore(player(b),t)-needScore(player(a),t)).slice(0,6)}function toggleKeeper(uid){let t=team(game.user);if(t.keepers.includes(uid))t.keepers=t.keepers.filter(x=>x!==uid);else if(t.keepers.length<6)t.keepers.push(uid);save();render()}function finalizeKeepers(){if(team(game.user).keepers.length!==6){alert('Choose exactly six keepers.');return}for(const t of game.teams){if(t.keepers.length!==6)autoKeep(t);for(const uid of [...t.roster])if(!t.keepers.includes(uid)){let p=player(uid);p.club=null;p.form=p.id;p.ratings=[...dex[p.id].ratings];p.history.push({year:game.year,event:'Released'});t.roster=t.roster.filter(x=>x!==uid)}t.lineup=[]}game.phase='evolution';save();render()}function offseasonEvolution(){for(const t of game.teams)for(const p of roster(t)){let s=p.stats[`${game.year}-season`]||blank();if(s.gp>20&&overall(p)<p.pot){let growth=clamp(Math.floor((s.g+s.a)/15)+(Math.random()<.3?1:0),0,2);p.ratings=p.ratings.map((v,i)=>clamp(v+growth,0,p.pot))}evolve(p,1)}game.year++;game.draftYear=game.year;game.order=game.archives.at(-1).table.slice().reverse().map(x=>x.id);createPicks(game.year+3);game.draftPick=0;game.draftLog=game.draftLog||[];game.phase='draft';save();render()}
function fillFA(){for(const t of game.teams){while(t.roster.length<11){let used=new Set(Object.values(game.players).filter(p=>p.club!==null).map(p=>dex[p.id].family));let p=Object.values(game.players).filter(p=>p.club===null&&!used.has(dex[p.id].family)).sort((a,b)=>needScore(b,t)-needScore(a,t))[0];if(!p)break;assign(p,t.id)}optimize(t)}game.phase='roster';save();render()}function sign(uid){let t=team(game.user),p=player(uid);if(!p||p.club!==null||t.roster.length>=11)return;let fam=dex[p.id].family;if(t.roster.some(x=>dex[player(x).id].family===fam))return;assign(p,t.id);save();render()}function release(uid){let t=team(game.user),p=player(uid);if(!t.roster.includes(uid))return;t.roster=t.roster.filter(x=>x!==uid);p.club=null;t.lineup=[];save();render()}
function pickValue(p){let projected=game.archives.at(-1)?.table.findIndex(x=>x.id===p.original)??10;let overallPick=(p.round-1)*20+(20-projected);let value=overallPick===1?90:overallPick<=5?85-(overallPick-2)*3:overallPick<=10?75-(overallPick-6)*3:overallPick<=20?60-(overallPick-11)*1.5:overallPick<=40?45-(overallPick-21):overallPick<=60?25-(overallPick-41)*.5:overallPick<=80?15-(overallPick-61)*.35:7-(overallPick-81)*.2;return Math.max(3,value)*Math.pow(.82,Math.max(0,p.year-game.year-1))}function tradeValue(uid,t){let p=player(uid);return overall(p)*.85+(p.pot-overall(p))*.55+(needScore(p,t)-overall(p))*.7}function tradeOffer(){let a=team(game.user),b=team(tradeTarget),mine=tradeMine?player(tradeMine):null,theirs=tradeTheirs?player(tradeTheirs):null,mp=game.picks[tradeMyPick],tp=game.picks[tradeTheirPick];if(!mine&&!mp||!theirs&&!tp){alert('Select an asset from each team.');return}if(mine&&mine.club!==a.id||theirs&&theirs.club!==b.id||mp&&mp.owner!==a.id||tp&&tp.owner!==b.id)return;let give=(mine?tradeValue(mine,b):0)+(mp?pickValue(mp):0),get=(theirs?tradeValue(theirs,a):0)+(tp?pickValue(tp):0),threshold={Easy:.77,Normal:.94,Hard:1.06}[game.settings.difficulty];if(give<get*threshold){pendingOffer={give,get};alert(`Offer rejected. CPU values your assets at ${give.toFixed(0)} versus ${get.toFixed(0)}. Improve the offer.`);return}if(mine){a.roster=a.roster.filter(x=>x!==mine.uid);mine.club=b.id;b.roster.push(mine.uid)}if(theirs){b.roster=b.roster.filter(x=>x!==theirs.uid);theirs.club=a.id;a.roster.push(theirs.uid)}if(mp)mp.owner=b.id;if(tp)tp.owner=a.id;a.lineup=[];b.lineup=[];game.trades.push({year:game.year,a:a.id,b:b.id,given:[tradeMine,tradeMyPick],received:[tradeTheirs,tradeTheirPick]});tradeMine=tradeTheirs=tradeMyPick=tradeTheirPick='';save();render()}
function row(p,action=''){return `<div class="row"><img src="${sprite(p)}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'"><div class="info"><b>${escapeHtml(playerName(p))}</b><small>#${p.form} · ${info(p).region} · ${info(p).preferred} · ST ${p.ratings[3]} MID ${p.ratings[2]} DEF ${p.ratings[1]} GK ${p.ratings[0]} · POT ${p.pot}</small></div><b class="num">${overall(p)}</b>${action}</div>`}function clubBadge(id){return `<span class="badge">${CLUBS[id].split(' ').map(x=>x[0]).slice(0,2).join('')}</span>`}function tableHTML(rows){return `<div class="scroll"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>OVR</th></tr>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${clubBadge(t.id)} ${escapeHtml(t.name)}</td><td>${t.w+t.d+t.l}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td class="num">${t.pts}</td><td>${t.ovr.toFixed(1)}</td></tr>`).join('')}</table></div>`}
function reportHTML(r){if(!r)return '';return `<div class="card"><h3>${CLUBS[r.home]} ${r.score[0]} – ${r.score[1]} ${CLUBS[r.away]}</h3><p class="muted">${r.formations.join(' / ')} · ${r.styles.join(' / ')}</p><div class="grid"><div>Shots: ${r.shots.join(' – ')}</div><div>On target: ${r.onTarget.join(' – ')}</div><div>Possession: ${r.possession.join('% – ')}%</div><div>Saves: ${r.saves.join(' – ')}</div></div><h3>Goals</h3>${r.events.map(e=>`<div class="row">${e.minute}' ${CLUBS[e.team]} · ${playerName(player(e.scorer))}${e.assist?' (assist '+playerName(player(e.assist))+')':''}</div>`).join('')||'<p>No goals</p>'}</div>`}
function dashboard(){let t=team(game.user),record=standings().find(x=>x.id===game.user),next=game.fixtures.find(f=>!f.score&&(f.home===t.id||f.away===t.id));return `<div class="banner"><h2>${clubBadge(t.id)} ${t.name}</h2><div class="muted">Season ${game.year} · ${game.phase.toUpperCase()}</div></div><div class="grid"><div class="card"><small>TEAM RATING</small><div class="stat">${strength(t).toFixed(1)}</div><small>${t.roster.length}/11 Pokémon</small></div><div class="card"><small>LEAGUE RECORD</small><div class="stat">${record.w}-${record.d}-${record.l}</div><small>${record.pts} points</small></div><div class="card"><small>NEXT FIXTURE</small><h3>${next?CLUBS[next.home]+' vs '+CLUBS[next.away]:'—'}</h3><small>${next?'Matchweek '+next.week:'No upcoming fixture'}</small></div><div class="card"><small>CHAMPIONSHIPS</small><div class="stat">${t.titles}</div></div></div><div class="card"><h2>Next step</h2>${game.phase==='draft'?`<button class="primary" onclick="view='Draft';render()">Go to draft</button>`:game.phase==='roster'||game.phase==='freeagency'?`<button class="primary" onclick="setupSeason()">Start regular season</button>`:game.phase==='season'?`<button class="primary" onclick="simWeek()">Simulate next matchweek</button> <button onclick="simRest()">Simulate rest of season</button>`:game.phase==='playoffs'?`<button class="primary" onclick="simPlayoffGame()">Simulate playoff game</button> <button onclick="simPlayoffs()">Finish playoffs</button>`:game.phase==='recap'?`<button class="primary" onclick="startKeepers()">Begin offseason</button>`:game.phase==='keepers'?`<button onclick="view='My Team';render()">Choose keepers</button>`:game.phase==='evolution'?`<button class="primary" onclick="offseasonEvolution()">Evolve and begin redraft</button>`:''}</div><div class="card"><h2>League standings</h2>${tableHTML(standings().slice(0,8))}</div>`}
function draftScreen(){if(game.phase!=='draft')return `<div class="card"><h2>Draft history</h2>${game.draftLog.slice(-100).reverse().map(x=>`<div class="row">#${x.pick} ${CLUBS[x.team]} — ${playerName(player(x.uid))}</div>`).join('')}</div>`;let current=order()[game.draftPick],pool=available().filter(p=>playerName(p).toLowerCase().includes(search.toLowerCase())&&(posFilter==='All'||info(p).preferred===posFilter)).sort((a,b)=>needScore(b,team(current))-needScore(a,team(current)));return `<div class="card"><h2>${game.draftYear===1?'Inaugural fantasy draft':'Annual redraft'} · Pick ${game.draftPick+1}/${order().length}</h2><p>Round ${Math.floor(game.draftPick/20)+1} · On the clock: <b class="gold">${CLUBS[current]}</b></p><div class="flex"><button onclick="autoPick()">Autodraft pick</button><button onclick="autoUntil()">To my next pick</button><button onclick="autoRest()">Complete draft</button></div></div><div class="split"><div class="card"><div class="flex"><input placeholder="Search Pokémon" value="${escapeHtml(search)}" oninput="search=this.value;render()"><select onchange="posFilter=this.value;render()">${['All',...POSITIONS].map(x=>`<option ${posFilter===x?'selected':''}>${x}</option>`)}</select><span class="muted">${pool.length} available</span></div>${pool.slice(0,90).map(p=>row(p,current===game.user?`<button class="primary" onclick="pickPlayer('${p.uid}')">Draft</button>`:'' )).join('')}</div><div class="card"><h3>Live draft board</h3>${order().slice(Math.max(0,game.draftPick-3),game.draftPick+20).map((id,i)=>`<div class="row"><small>#${Math.max(0,game.draftPick-3)+i+1}</small>${CLUBS[id]}</div>`).join('')}<h3>Recent selections</h3>${game.draftLog.slice(-15).reverse().map(x=>`<div class="row"><small>#${x.pick}</small>${playerName(player(x.uid))} · ${CLUBS[x.team]}</div>`).join('')}</div></div>`}
function myTeam(){let t=team(game.user),slots=lineupPositions(t);return `<div class="flex"><select onchange="tForm(this.value)">${Object.keys(FORMATIONS).map(x=>`<option ${t.formation===x?'selected':''}>${x}</option>`)}</select><select onchange="tStyle(this.value)">${STYLES.map(x=>`<option ${t.style===x?'selected':''}>${x}</option>`)}</select><button onclick="optimize(team(game.user));save();render()">Optimize XI</button><span class="pill">Team rating ${strength(t).toFixed(1)}</span></div><div class="split"><div class="card"><h2>Starting XI</h2><div class="pitch">${[slots.slice(8),slots.slice(5,8),slots.slice(1,5),slots.slice(0,1)].map((line,k)=>{let indexes=k===0?slots.map((_,i)=>i).filter(i=>i>=slots.length-3):k===1?slots.map((_,i)=>i).filter(i=>i>=5&&i<slots.length-3):k===2?[1,2,3,4]:[0];if(k===0||k===1||k===2){let sections=[slots.map((_,i)=>i).filter(i=>slots[i]==='ST'),slots.map((_,i)=>i).filter(i=>slots[i]==='MID'),slots.map((_,i)=>i).filter(i=>slots[i]==='DEF')];indexes=sections[k]}return `<div class="pitchline">${indexes.map(i=>{let p=player(t.lineup[i]||t.roster[i]);return `<div class="slot">${p?`<img src="${sprite(p)}"><b>${escapeHtml(playerName(p))}</b><span class="gold">${rate(p,slots[i])} ${slots[i]}</span>`:'Empty'}<select onchange="setSlot(${i},this.value)">${t.roster.map(uid=>`<option value="${uid}" ${t.lineup[i]===uid?'selected':''}>${escapeHtml(playerName(player(uid)))}</option>`)}</select></div>`}).join('')}</div>`}).join('')}</div></div><div class="card"><h2>Roster ${t.roster.length}/11</h2>${roster(t).map(p=>row(p,game.phase==='keepers'?`<button onclick="toggleKeeper('${p.uid}')">${t.keepers.includes(p.uid)?'✓ Keep':'Keep'}</button>`:game.phase==='roster'||game.phase==='season'?`<button onclick="train('${p.uid}')">Train</button>`:'')).join('')}${game.phase==='keepers'?`<p>${t.keepers.length}/6 keepers selected</p><button onclick="autoKeep(team(game.user));save();render()">Auto-select six</button><button class="primary" onclick="finalizeKeepers()">Confirm keepers</button>`:''}</div></div>`}
function setSlot(i,uid){let t=team(game.user),j=t.lineup.indexOf(uid);if(j>=0)[t.lineup[i],t.lineup[j]]=[t.lineup[j],t.lineup[i]];else t.lineup[i]=uid;save();render()}function tForm(x){let t=team(game.user);t.formation=x;optimize(t);save();render()}function tStyle(x){team(game.user).style=x;save();render()}function train(uid){let p=player(uid);if(p.training>=3){alert('Training limit: three sessions per season.');return}let pos=prompt('Train which position? GK, DEF, MID or ST',info(p).preferred)?.toUpperCase();if(!POSITIONS.includes(pos))return;let i=POSITIONS.indexOf(pos);p.familiarity[i]=clamp((p.familiarity[i]||0)+1,0,3);p.training++;save();render()}
function scheduleScreen(){let fs=game.fixtures.filter(f=>scheduleFilter==='all'||scheduleFilter==='mine'&&(f.home===game.user||f.away===game.user)||scheduleFilter==='done'&&f.score||scheduleFilter==='upcoming'&&!f.score);return `<div class="card"><div class="flex"><h2>League schedule · ${game.week}/38 weeks</h2><select onchange="scheduleFilter=this.value;render()">${[['mine','My club'],['all','All clubs'],['done','Completed'],['upcoming','Upcoming']].map(([v,n])=>`<option value="${v}" ${scheduleFilter===v?'selected':''}>${n}</option>`)}</select>${game.phase==='season'?'<button class="primary" onclick="simWeek()">Next week</button><button onclick="simRest()">Rest of season</button>':''}</div><div class="scroll"><table><tr><th>Week</th><th>Home</th><th>Away</th><th>Score</th><th>Report</th></tr>${fs.map(f=>`<tr><td>${f.week}</td><td>${CLUBS[f.home]}</td><td>${CLUBS[f.away]}</td><td>${f.score?f.score.join(' – '):'—'}</td><td>${f.report?`<button onclick="showReport(${game.fixtures.indexOf(f)})">View</button>`:''}</td></tr>`).join('')}</table></div></div><div id="report"></div>`}function showReport(i){$('report').innerHTML=reportHTML(game.fixtures[i].report);$('report').scrollIntoView({behavior:'smooth',block:'nearest'})}
function playoffScreen(){return `<div class="card"><h2>Playoff bracket</h2>${game.playoffs.map((round,i)=>`<h3>${['Quarterfinals','Semifinals','Championship'][i]}</h3><div class="grid">${round.series.map(s=>`<div class="card"><div class="flex between"><b>${CLUBS[s.a]}</b><b class="num">${s.wins[0]}</b></div><div class="flex between"><b>${CLUBS[s.b]}</b><b class="num">${s.wins[1]}</b></div><small>${s.games.length} games played · Best of 7</small>${s.games.map(r=>`<div class="tiny muted">${CLUBS[r.home]} ${r.score.join('–')} ${CLUBS[r.away]}</div>`).join('')}</div>`).join('')}</div>`).join('')}${game.phase==='playoffs'?'<button class="primary" onclick="simPlayoffGame()">Simulate next game</button> <button onclick="simPlayoffs()">Complete playoffs</button>':''}${game.champion!==null?`<h2 class="gold">Champion: ${CLUBS[game.champion]}</h2>`:''}</div>`}
function freeAgents(){let t=team(game.user),free=Object.values(game.players).filter(p=>p.club===null&&playerName(p).toLowerCase().includes(search.toLowerCase())&&(posFilter==='All'||info(p).preferred===posFilter)).sort((a,b)=>overall(b)-overall(a));return `<div class="card"><h2>Free Agency · ${t.roster.length}/11</h2><div class="flex"><input placeholder="Search" value="${escapeHtml(search)}" oninput="search=this.value;render()"><select onchange="posFilter=this.value;render()">${['All',...POSITIONS].map(x=>`<option ${posFilter===x?'selected':''}>${x}</option>`)}</select>${game.phase==='roster'||game.phase==='freeagency'?'<button class="primary" onclick="fillFA()">Fill CPU vacancies</button> <button onclick="setupSeason()">Start season</button>':''}</div>${free.slice(0,100).map(p=>row(p,`<button onclick="sign('${p.uid}')" ${t.roster.length>=11?'disabled':''}>Sign</button>`)).join('')}</div><div class="card"><h2>Release player</h2>${roster(t).map(p=>row(p,`<button onclick="release('${p.uid}')">Release</button>`)).join('')}</div>`}
function tradesScreen(){let a=team(game.user),b=team(tradeTarget),opt=(list,sel)=>`<option value="">— None —</option>`+list.map(([v,n])=>`<option value="${v}" ${sel===v?'selected':''}>${escapeHtml(n)}</option>`).join('');return `<div class="card"><h2>Trade Centre</h2><p class="muted">Only you initiate trades. CPU evaluates asset values and roster needs.</p><div class="flex">CPU club <select onchange="tradeTarget=Number(this.value);render()">${game.teams.filter(t=>t.id!==game.user).map(t=>`<option value="${t.id}" ${tradeTarget===t.id?'selected':''}>${t.name}</option>`)}</select> Difficulty: <select onchange="game.settings.difficulty=this.value;save();render()">${['Easy','Normal','Hard'].map(x=>`<option ${game.settings.difficulty===x?'selected':''}>${x}</option>`)}</select></div><div class="grid"><div class="card"><h3>You give</h3><select onchange="tradeMine=this.value">${opt(roster(a).map(p=>[p.uid,playerName(p)+' '+overall(p)]),tradeMine)}</select><h3>Pick</h3><select onchange="tradeMyPick=this.value">${opt(ownedPicks(a.id,game.year+1).concat(ownedPicks(a.id,game.year+2),ownedPicks(a.id,game.year+3)).map(([k,p])=>[k,`${p.year} R${p.round} (${CLUBS[p.original]})`]),tradeMyPick)}</select></div><div class="card"><h3>You receive</h3><select onchange="tradeTheirs=this.value">${opt(roster(b).map(p=>[p.uid,playerName(p)+' '+overall(p)]),tradeTheirs)}</select><h3>Pick</h3><select onchange="tradeTheirPick=this.value">${opt([game.year+1,game.year+2,game.year+3].flatMap(y=>ownedPicks(b.id,y)).map(([k,p])=>[k,`${p.year} R${p.round} (${CLUBS[p.original]})`]),tradeTheirPick)}</select></div></div><button class="primary" onclick="tradeOffer()">Propose trade</button></div><div class="card"><h2>Trade history</h2>${game.trades.map(x=>`<div class="row">Season ${x.year} · ${CLUBS[x.a]} ↔ ${CLUBS[x.b]}</div>`).join('')||'<p>No trades yet</p>'}</div>`}
function statsScreen(){let sorted=Object.values(game.players).filter(p=>totals(p,statMode).gp>0).sort((a,b)=>(totals(b,statMode).g+totals(b,statMode).a)-(totals(a,statMode).g+totals(a,statMode).a)).slice(0,100);return `<div class="card"><h2>Player statistics</h2><div class="tabs">${[['season','Regular season'],['playoffs','Playoffs'],['career','Career']].map(([v,n])=>`<button class="${statMode===v?'active':''}" onclick="statMode='${v}';render()">${n}</button>`)}</div><div class="scroll"><table><tr><th>Player</th><th>Team</th><th>GP</th><th>G</th><th>A</th><th>PTS</th><th>Saves</th><th>CS</th><th>W</th></tr>${sorted.map(p=>{let s=totals(p,statMode);return `<tr><td><img src="${sprite(p)}" style="height:32px;vertical-align:middle"> ${escapeHtml(playerName(p))}</td><td>${p.club===null?'FA':CLUBS[p.club]}</td><td>${s.gp}</td><td>${s.g}</td><td>${s.a}</td><td>${s.g+s.a}</td><td>${s.saves}</td><td>${s.cs}</td><td>${s.w}</td></tr>`}).join('')}</table></div></div>`}
function historyScreen(){return `<div class="card"><h2>Championship history</h2>${game.archives.slice().reverse().map(a=>`<div class="row"><span class="badge">${a.year}</span><b>${CLUBS[a.champion]}</b><span class="muted">defeated ${CLUBS[a.runnerUp]}</span></div>`).join('')||'<p>No completed seasons</p>'}</div><div class="card"><h2>Season awards</h2>${game.archives.slice().reverse().map(a=>`<h3>Season ${a.year}</h3>`+a.awards.map(([title,uid])=>`<div class="row">${title}: ${uid?playerName(player(uid)):'—'}</div>`).join('')).join('')}</div>`}
function recapScreen(){let a=game.recap;if(!a)return '';return `<div class="banner"><h2>Season ${a.year} complete</h2><div class="stat">${CLUBS[a.champion]}</div><p>Champions · Runner-up: ${CLUBS[a.runnerUp]}</p><button class="primary" onclick="startKeepers()">Proceed to keeper selection</button></div><div class="card"><h2>Final standings</h2>${tableHTML(a.table)}</div>`}
function settingsScreen(){return `<div class="card"><h2>Save management</h2><p>Autosaves locally after each action. Export a backup before clearing browser data.</p><div class="flex"><button class="primary" onclick="exportSave()">Export save</button><label>Import save <input type="file" accept=".json" onchange="importSave(this)"></label><button onclick="backup()">Create backup</button><button onclick="restoreBackup()">Restore backup</button><button onclick="resetGame()">New game / Reset</button></div><p class="muted">Save schema v${SAVE_VERSION}. Offline sprites require cached images or an internet connection.</p></div>`}
function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(game)],{type:'application/json'}));a.download=`pokemon-xi-season-${game.year}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function valid(g){return g&&g.version===SAVE_VERSION&&g.teams?.length===20&&g.players&&g.picks&&Array.isArray(g.archives)}async function importSave(el){try{let g=JSON.parse(await el.files[0].text());if(!valid(g))throw Error('Invalid or incompatible save schema');if(!confirm('Replace current progress with imported save?'))return;game=g;save();render()}catch(e){alert('Import failed: '+e.message)}}function backup(){localStorage.setItem(KEY+'-backup',JSON.stringify(game));alert('Backup saved in this browser.')}function restoreBackup(){let g=JSON.parse(localStorage.getItem(KEY+'-backup')||'null');if(valid(g)&&confirm('Restore backup?')){game=g;save();render()}else if(!valid(g))alert('No valid backup')}function resetGame(){if(confirm('Start a new game? Existing progress will be lost unless exported.')){localStorage.removeItem(KEY);game=null;render()}}
function render(){let nav=['Dashboard','My Team','Draft','Schedule','Standings','Playoffs','Trades','Free Agency','Statistics','History','Settings'];$('nav').innerHTML=game?nav.map(x=>`<button class="${view===x?'active':''}" onclick="view='${x}';render()">${x}</button>`).join(''):'';$('status').textContent=game?`Season ${game.year} · ${game.phase} · ${CLUBS[game.user]}`:'Create a new dynasty';if(!game){$('app').innerHTML=`<div class="banner"><h2>Build your Pokémon dynasty</h2><p>20 clubs. 220 inaugural draft picks. 38 league matches. Best-of-seven playoffs.</p><select id="club">${CLUBS.map((c,i)=>`<option value="${i}">${c}</option>`)}</select> <button class="primary" onclick="makeGame(Number($('club').value))">Start dynasty</button></div>`;return}if(tradeTarget===game.user)tradeTarget=(game.user+1)%20;let content={'Dashboard':dashboard,'My Team':myTeam,'Draft':draftScreen,'Schedule':scheduleScreen,'Standings':()=>`<div class="card"><h2>League table</h2>${tableHTML(standings())}</div>`,'Playoffs':playoffScreen,'Trades':tradesScreen,'Free Agency':freeAgents,'Statistics':statsScreen,'History':historyScreen,'Settings':settingsScreen}[view]();$('app').innerHTML=(game.phase==='recap'&&view==='Dashboard'?recapScreen():'')+content}
createDex();try{let g=JSON.parse(localStorage.getItem(KEY)||'null');if(valid(g))game=g}catch(e){}render();loadNames();
</script></body></html>
