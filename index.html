function offPickTeam(){return S.teams[S.offseasonOrder[S.pickIndex%20]]}function offDraftPlayer(id){let t=offPickTeam(),p=player(id);if(!p||p.owner!==null)return;let round=Math.floor(S.pickIndex/20);if(round===0)p.stage=family(p).forms.length-1;else if(round===1)p.stage=Math.min(1,family(p).forms.length-1);else p.stage=0;assign(p,t);S.draftHistory.push(`${t.name}: ${pname(p)} (Round ${round+1})`);S.pickIndex++;if(S.pickIndex>=120){S.phase='rostercheck';S.season++;S.players.forEach(p=>{p.seasonStats={gp:0,w:0,d:0,g:0,a:0,shots:0,saves:0,so:0};if(p.owner!==null){p.previousTeam=p.owner;if(p.stage<family(p).forms.length-1){p.stage++;p.ratings=p.ratings.map(x=>clamp(x+.28,5,10))}let ceiling=p.potential+(random()-.5)*1.0,headroom=Math.max(0,ceiling-Math.max(...p.ratings)-p.growth);p.growth=clamp(p.growth+(p.legendary?.005:Math.max(.015,headroom*.13))+(random()-.5)*(p.legendary?.025:.24),-.4,2.5)}});buildFixtures();ui.tab='home'}save();render()}
function skipOff(all=false){let cap=0;while(S.phase==='offdraft'&&(all||offPickTeam().id!==S.user)&&cap++<120){let pool=available().sort((a,b)=>value(b)+random()*15-value(a)-random()*15);if(!pool.length)break;offDraftPlayer(pool[0].id)}render()}
function sign(id){let p=player(id),t=me();if(t.roster.length>=11){toast('Release a Pokémon before signing.');return}assign(p,t);save();render()}function drop(id){release(player(id));save();render()}
function swapSlot(i){let t=me();if(ui.slot===null){ui.slot=i;render();return}let a=t.formation[ui.slot],b=t.formation[i];t.formation[ui.slot]=b;t.formation[i]=a;ui.slot=null;save();render()}
function setTab(tab){ui.tab=tab;ui.selected=null;render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,action,cls=''){return `<button class="${cls}" onclick="${action}">${label}</button>`}function lineup(t){let rows=[[9,10],[5,6,7,8],[1,2,3,4],[0]];return `<div class="field">${rows.map(row=>`<div class="fieldrow">${row.map(i=>{let p=player(t.formation[i]);return `<div class="slot ${ui.slot===i?'active':''}" onclick="swapSlot(${i})"><span class="small">${['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','ST','ST'][i]}</span><strong>${p?esc(pname(p)):'Empty'}</strong><span class="rating">${p?rate(p,position(i)).toFixed(1):'—'}</span></div>`}).join('')}</div>`).join('')}</div>`}
function dashboard(){let t=me(),next=S.phase==='season'?S.fixtures[S.round]?.find(([a,b])=>a===t.id||b===t.id):null;return `<div class="statcards"><div class="statcard"><div class="muted">Season</div><strong>${S.season}</strong></div><div class="statcard"><div class="muted">Matchweek</div><strong>${S.round}/38</strong></div><div class="statcard"><div class="muted">Record</div><strong>${t.wins}-${t.draws}-${t.losses}</strong></div><div class="statcard"><div class="muted">Championships</div><strong>${t.titles}</strong></div></div><div class="grid" style="margin-top:14px"><section class="panel"><h2>${esc(t.name)}</h2><p class="muted">${S.phase==='season'?'Regular season':S.phase==='playoffs'?'Playoffs':S.phase==='offseason'?'Keeper selection':'Draft day'}</p>${next?`<p>Next opponent: <b class="accent">${esc(S.teams[next.find(x=>x!==t.id)].name)}</b></p>`:''}<div class="toolbar">${S.phase==='season'?btn('Simulate Matchweek '+(S.round+1),'playRound()'):''}${S.phase==='playoffs'?btn('Simulate Playoff Round','playPlayoffs()'):''}${S.phase==='offseason'?btn('Select 5 Keepers',"setTab('keepers')"):''}${S.phase==='draft'||S.phase==='offdraft'?btn('Open Draft',"setTab('draft')"):''}${btn('Auto Best XI','autoBest()','outline')}</div>${S.results.length?`<h3>Last Matchweek</h3><div class="scroll">${S.results.at(-1).map(m=>`<div class="item"><span>${esc(S.teams[m.a].name)}</span><b>${m.hg}–${m.ag}</b><span>${esc(S.teams[m.b].name)}</span></div>`).join('')}</div>`:''}${S.champion!==null&&S.phase==='offseason'?`<h3 class="accent">Season ${S.season} Champions: ${esc(S.teams[S.champion].name)}</h3>`:''}</section><section class="panel"><div class="between"><h3>Best XI</h3>${btn('Optimize','autoBest()','outline tinybtn')}</div>${lineup(t)}<p class="muted small">Tap two positions to swap players. Ratings change with position.</p></section></div>`}
function autoBest(){optLineup(me());save();render()}
function draftView(){let initial=S.phase==='draft',active=initial||S.phase==='offdraft';if(!active)return `<section class="panel"><h2>Draft Room</h2><p>No draft is currently active.</p></section>`;let t=initial?currentPickTeam():offPickTeam(),round=Math.floor(S.pickIndex/20)+1,number=S.pickIndex%20+1;let pool=available().filter(p=>pname(p).toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>value(b)-value(a));return `<div class="between"><h2>${initial?'Initial Snake Draft':'Offseason Draft'} · Round ${round}</h2><span class="pill">Pick ${number}/20 · ${esc(t.name)}</span></div><div class="toolbar">${btn('Skip to My Pick',initial?'skipPick(false)':'skipOff(false)','outline')}${btn('Autodraft Remaining',initial?'skipPick(true)':'skipOff(true)','outline')}</div><div class="grid"><section class="panel"><div class="between"><h3>Available Pokémon (${available().length})</h3><span class="badge">${initial?'11 rounds · snake':'6 rounds · fixed order'}</span></div><input id="search" placeholder="Search Pokémon" value="${esc(ui.search)}" oninput="ui.search=this.value;updatePool()"><div id="pool" class="scroll">${poolMarkup(pool,t,initial)}</div></section><section class="panel"><h3>Your Live XI (${me().roster.length}/11)</h3>${lineup(me())}<div class="toolbar">${btn('Auto Best XI','autoBest()','outline')}</div><h3>Recent Selections</h3><div class="scroll">${(initial?S.log:S.draftHistory.slice().reverse()).slice(0,8).map(x=>`<div class="item small">${esc(x)}</div>`).join('')}</div></section></div>`}
function poolMarkup(pool,t,initial){return pool.map(p=>`<div class="item"><div><div class="name">${esc(pname(p))} <span class="muted small">${family(p).type}</span></div><div class="muted small">ST ${rate(p,0).toFixed(1)} · MID ${rate(p,1).toFixed(1)} · DEF ${rate(p,2).toFixed(1)} · GK ${rate(p,3).toFixed(1)} · POT ${p.potential.toFixed(1)} · CHEM +${chemistry(p).toFixed(2)} · Value ${value(p)}</div><div class="badge">${esc(family(p).forms.join(' → '))}</div></div>${t.id===S.user?btn('Draft',`${initial?'draftPlayer':'offDraftPlayer'}(${p.id})`,'tinybtn'):''}</div>`).join('')||'<p class="muted">No available Pokémon.</p>'}function updatePool(){let t=S.phase==='draft'?currentPickTeam():offPickTeam();document.getElementById('pool').innerHTML=poolMarkup(available().filter(p=>pname(p).toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>value(b)-value(a)),t,S.phase==='draft')}
function keepers(){if(S.phase!=='offseason')return `<section class="panel"><h2>Keeper Selection</h2><p>Keeper selection opens after the playoffs.</p></section>`;return `<section class="panel"><h2>Choose Your Five Keepers</h2><p class="muted">Select exactly five Pokémon. The other six return to free agency. Draft begins immediately after submission.</p><div class="pill">${me().keepers.length}/5 selected</div>${me().roster.map(id=>{let p=player(id);return `<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">Potential ${p.potential.toFixed(1)} · Trade ${value(p)}</div></div>${btn(me().keepers.includes(id)?'Selected ✓':'Keep',`keeperToggle(${id})`,me().keepers.includes(id)?'':'outline')}</div>`}).join('')}<div class="toolbar" style="margin-top:15px">${btn('Submit 5 & Start Draft','submitKeepers()',me().keepers.length===5?'':'outline')}</div></section>`}
function standingsView(){return `<section class="panel"><h2>League Standings · Season ${S.season}</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${standings().map((t,i)=>`<tr class="${t.id===S.user?'mine':''}"><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.wins+t.draws+t.losses}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${points(t)}</b></td></tr>`).join('')}</tbody></table></div></section>`}
function statsView(){let t=me(),sort=ui.stats;return `<section class="panel"><h2>Statistics & History</h2><div class="toolbar">${['teams','goals','assists','shots','saves','shutouts','winpct'].map(x=>btn(x==='winpct'?'Win %':x[0].toUpperCase()+x.slice(1),`ui.stats='${x}';render()`,ui.stats===x?'':'outline')).join('')}</div>${sort==='teams'?`<div style="overflow:auto"><table><tr><th>Team</th><th>All-time W</th><th>D</th><th>L</th><th>Playoffs</th><th>Series W</th><th>Titles</th></tr>${S.teams.map(x=>{let h=x.history;return `<tr><td>${esc(x.name)}</td><td>${h.reduce((a,b)=>a+b.w,0)+x.wins}</td><td>${h.reduce((a,b)=>a+b.d,0)+x.draws}</td><td>${h.reduce((a,b)=>a+b.l,0)+x.losses}</td><td>${x.playoffs}</td><td>${x.seriesWins}</td><td>${x.titles} ${'★'.repeat(x.titles)}</td></tr>`}).join('')}</table></div>`:`<div style="overflow:auto"><table><tr><th>#</th><th>Pokémon</th><th>Team</th><th>GP</th><th>${sort==='winpct'?'Win %':sort}</th></tr>${[...S.players].filter(p=>p.stats.gp>0).sort((a,b)=>metric(b,sort)-metric(a,sort)).slice(0,40).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(pname(p))}</td><td>${p.owner===null?'FA':esc(S.teams[p.owner].name)}</td><td>${p.stats.gp}</td><td>${sort==='winpct'?metric(p,sort).toFixed(1)+'%':metric(p,sort)}</td></tr>`).join('')}</table></div>`}</section><section class="panel"><h3>${esc(t.name)} · Season-by-season</h3><table><tr><th>Season</th><th>W-D-L</th><th>GF</th><th>GA</th><th>Champion</th></tr>${t.history.map(h=>`<tr><td>${h.season}</td><td>${h.w}-${h.d}-${h.l}</td><td>${h.gf}</td><td>${h.ga}</td><td>${h.champ?'★':'—'}</td></tr>`).join('')}</table></section>`}function metric(p,k){let s=p.stats;return k==='winpct'?s.gp?s.w/s.gp*100:0:k==='shutouts'?s.so:s[k==='goals'?'g':k==='assists'?'a':k]||0}
function faView(){let pool=available().sort((a,b)=>value(b)-value(a));return `<div class="grid"><section class="panel"><h2>Free Agency (${pool.length})</h2><p class="muted">Release one player before signing if your roster has 11.</p><div class="scroll">${pool.slice(0,100).map(p=>`<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">${Math.max(...p.ratings).toFixed(1)} best · ${family(p).type}</div></div>${btn('Sign',`sign(${p.id})`,'tinybtn')}</div>`).join('')}</div></section><section class="panel"><h2>Your Roster (${me().roster.length}/11)</h2>${me().roster.map(id=>{let p=player(id);return `<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">Trade value ${value(p)}</div></div>${btn('Release',`drop(${id})`,'outline tinybtn danger')}</div>`}).join('')}</section></div>`}
function tradeView(){let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget];if(!other)other=S.teams[(S.user+1)%20];return `<section class="panel"><h2>Trade Centre</h2><p class="muted">Trades close after Matchweek 30. Pokémon retain their evolution when traded.</p><div class="flex"><label>Trade partner</label><select onchange="ui.tradeTarget=+this.value;ui.tradeOffer=null;ui.tradeAsk=null;render()">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}" ${other.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="grid" style="margin-top:14px"><div><h3>Offer One Pokémon</h3>${me().roster.map(id=>{let p=player(id);return `<div class="item ${ui.tradeOffer===id?'selected':''}" onclick="ui.tradeOffer=${id};render()"><span>${esc(pname(p))}</span><span class="accent">${value(p)}</span></div>`}).join('')}</div><div><h3>Request One Pokémon</h3>${other.roster.map(id=>{let p=player(id);return `<div class="item ${ui.tradeAsk===id?'selected':''}" onclick="ui.tradeAsk=${id};render()"><span>${esc(pname(p))}</span><span class="accent">${value(p)}</span></div>`}).join('')}</div></div><div class="toolbar" style="margin-top:14px">${btn('Propose Trade','tradeNow()')}</div></section>`}
function tradeNow(){if(S.phase==='season'&&S.round>=30){toast('Trade deadline has passed.');return}if(ui.tradeOffer===null||ui.tradeAsk===null){toast('Choose a Pokémon from each team.');return}let a=player(ui.tradeOffer),b=player(ui.tradeAsk),other=S.teams[b.owner];let odds=value(a)>=value(b)?1:Math.exp(-(value(b)-value(a))/17);if(random()>odds){toast('Trade rejected by '+other.name);return}let mine=me();other.roster=other.roster.filter(x=>x!==b.id);mine.roster=mine.roster.filter(x=>x!==a.id);a.owner=other.id;b.owner=mine.id;other.roster.push(a.id);mine.roster.push(b.id);optLineup(other);optLineup(mine);ui.tradeOffer=ui.tradeAsk=null;toast('Trade accepted!');save()}
function playoffsView(){return `<section class="panel"><h2>Playoffs · Season ${S.season}</h2><p class="muted">Top 10 qualify · Reseeded highest vs lowest each round · Best of 1 / 3 / 5 / 7 / 7</p>${S.playoffRounds.map((r,i)=>`<h3>${['Play-in','Qualifying','Quarterfinals','Semifinals','Championship'][i]}</h3>${r.map(s=>`<div class="item"><span>${esc(S.teams[s.a].name)} ${s.aw}</span><b>vs</b><span>${s.bw} ${esc(S.teams[s.b].name)}</span><span class="pill">${esc(S.teams[s.winner].name)} advances</span></div>`).join('')}`).join('')}${S.phase==='playoffs'?btn('Simulate Next Round','playPlayoffs()'):''}${S.champion!==null?`<h2 class="accent">🏆 ${esc(S.teams[S.champion].name)} — Champions</h2>`:''}</section>`}
function eeveeView(){let ee=S.players.find(p=>family(p).forms[0]==='Eevee');return `<section class="panel"><h2>Eevee Legacy</h2><p>At season's end, Eevee's owner chooses a new Eeveelution. That form becomes a permanent independent player. Eevee returns to the pool until all seven are active.</p><p>Active forms: ${S.eeveeUnlocked.join(', ')||'None'}</p><p class="accent">${S.eeveeUnlocked.length}/7 unlocked</p>${S.phase==='offseason'&&ee.owner===S.user?EEVEES.filter(x=>!S.eeveeUnlocked.includes(x)).map(x=>btn(x,`evolveEevee('${x}')`,'outline')).join(' '):'<p class="muted">Evolution choice appears here when you own Eevee at season end.</p>'}</section>`}function evolveEevee(name){if(S.phase!=='offseason'||S.eeveeUnlocked.includes(name))return;let ee=S.players.find(p=>family(p).forms[0]==='Eevee'),owner=ee.owner;if(owner===null)return;let p={...structuredClone(ee),id:S.nextPlayerId++,custom:name,stage:0,owner:null};p.stats={gp:0,w:0,d:0,g:0,a:0,shots:0,saves:0,so:0};p.seasonStats={...p.stats};p.ratings=p.ratings.map(x=>clamp(x+1,5,10));S.players.push(p);release(ee);assign(p,S.teams[owner]);S.eeveeUnlocked.push(name);S.freeEevee=S.eeveeUnlocked.length<7;S.players.filter(x=>x.custom).forEach(x=>x.growth=clamp(x.growth+.1,-.5,1.5));save();render()}
function setup(){return `<section class="panel"><h2>Start Your Dynasty</h2><p class="muted">20 clubs. 11 Pokémon per team. Random 11-round snake draft. 38-match seasons and ten-team reseeded playoffs.</p><label>Choose your club</label><p><select id="teamSelect">${NAMES.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select></p>${btn('Begin Random Draft','start()')}<p class="muted small">Progress saves automatically in this browser.</p></section>`}
function render(){let app=document.getElementById('app');if(!S)init();let tabs=[['home','Dashboard'],['draft','Draft'],['lineup','Lineup'],['standings','Standings'],['playoffs','Playoffs'],['keepers','Keepers'],['trades','Trades'],['free','Free Agency'],['stats','Stats'],['eevee','Eevee']];app.innerHTML=`<header><div><div class="logo">POKÉMON <span>XI</span></div><div class="sub small">DYNASTY MANAGER · ${S.phase==='setup'?'NEW LEAGUE':esc(me().name)+' · SEASON '+S.season}</div></div><div class="flex"><span class="pill">Autosave On</span>${btn('New Dynasty','resetGame()','outline tinybtn')}</div></header>${S.phase==='setup'?setup():`<nav class="tabs">${tabs.map(([id,label])=>btn(label,`setTab('${id}')`,ui.tab===id?'active':'')).join('')}</nav>${ui.tab==='home'?dashboard():ui.tab==='draft'?draftView():ui.tab==='lineup'?`<div class="grid"><section class="panel"><h2>Lineup Editor</h2>${lineup(me())}<p class="muted">Tap two positions to swap Pokémon.</p>${btn('Auto Best XI','autoBest()')}</section><section class="panel"><h3>Player Ratings</h3>${me().roster.map(id=>{let p=player(id);return `<div class="item"><b>${esc(pname(p))}</b><span class="muted small">ST ${rate(p,0).toFixed(1)} · MID ${rate(p,1).toFixed(1)} · DEF ${rate(p,2).toFixed(1)} · GK ${rate(p,3).toFixed(1)} · POT ${p.potential.toFixed(1)} · CHEM +${chemistry(p).toFixed(2)}</span></div>`}).join('')}</section></div>`:ui.tab==='standings'?standingsView():ui.tab==='playoffs'?playoffsView():ui.tab==='keepers'?keepers():ui.tab==='trades'?tradeView():ui.tab==='free'?faView():ui.tab==='stats'?statsView():eeveeView()}`}${ui.notice?`<div class="toast">${esc(ui.notice)}</div>`:''}<p class="muted small" style="text-align:center">Playable browser build · Deterministic seeded simulations · Local autosave · No Supabase connection configured</p>`}

const OLD_INIT=init;
init=function(){OLD_INIT();if(!S.pickOwners)S.pickOwners={};if(!S.tradeLog)S.tradeLog=[];if(!S.playerSeasonHistory)S.playerSeasonHistory={};if(!S.draftAcquisitions)S.draftAcquisitions={};if(!S.pendingYear)S.pendingYear=null;S.players.forEach(p=>{if(p.legendary){p.ratings=p.ratings.map((x,i)=>Math.max(x,8.0+(Math.sin(p.id*11+i*7)+1)*.72));p.potential=Math.max(p.potential,9)} });save()};
const BASE_SAVE=save;
save=function(){if(S)BASE_SAVE()};
function pickKey(year,round,origin){return year+'-'+round+'-'+origin}
function pickOwner(year,round,origin){let k=pickKey(year,round,origin);return S.pickOwners[k]===undefined?origin:S.pickOwners[k]}
function ownedPicks(teamId){let out=[];for(let y=S.season+1;y<=S.season+3;y++)for(let r=1;r<=6;r++)for(let origin=0;origin<20;origin++)if(pickOwner(y,r,origin)===teamId)out.push({year:y,round:r,origin,key:pickKey(y,r,origin)});return out}
function pickVal(x){let delay=Math.max(0,x.year-S.season),base=[0,27,23,19,15,12,9][x.round];let rank=standings().findIndex(t=>t.id===x.origin);let posFactor=1.2-.4*(19-rank)/19;return Math.round(base*posFactor*Math.pow(.78,delay))}
function teamAssets(t){return {players:t.roster.map(id=>({kind:'p',id,label:pname(player(id)),value:value(player(id))})),picks:ownedPicks(t.id).map(x=>({kind:'k',id:x.key,label:`Y${x.year} R${x.round} · ${S.teams[x.origin].name}`,value:pickVal(x)}))}}

function assetMarkup(t,side){let assets=teamAssets(t);return `<h4>Pokémon (${assets.players.length})</h4>${assets.players.map(a=>assetRow(a,side)).join('')}<h4>Draft Picks (${assets.picks.length})</h4><div class="scroll" style="max-height:220px">${assets.picks.map(a=>assetRow(a,side)).join('')}</div>`}
function assetRow(a,side){let key=a.kind+':'+a.id,selected=(side==='offer'?ui.offerAssets:ui.askAssets).includes(key);return `<div class="item ${selected?'selected':''}" onclick="toggleAsset('${side}','${a.kind}','${a.id}')"><span>${selected?'☑':'□'} ${esc(a.label)}</span><b class="accent">${a.value}</b></div>`}
tradeView=function(){let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget];if(!other)other=S.teams[(S.user+1)%20];let av=teamAssets(me()),bv=teamAssets(other);let v1=ui.offerAssets.reduce((n,k)=>n+([...av.players,...av.picks].find(a=>a.kind+':'+a.id===k)?.value||0),0),v2=ui.askAssets.reduce((n,k)=>n+([...bv.players,...bv.picks].find(a=>a.kind+':'+a.id===k)?.value||0),0);return `<section class="panel"><h2>Trade Centre · Unlimited Asset Combinations</h2><p class="muted">Trade Pokémon and picks up to three seasons ahead. No equal asset-count requirement. Trades close after matchweek 30. Fix roster sizes before kickoff.</p><label>Trade partner</label><select onchange="ui.tradeTarget=+this.value;ui.offerAssets=[];ui.askAssets=[];render()">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}" ${other.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="grid"><section><h3>You offer · ${v1} value</h3>${assetMarkup(me(),'offer')}</section><section><h3>You request · ${v2} value</h3>${assetMarkup(other,'ask')}</section></div><p><b>Value: ${v1} offered / ${v2} requested</b> ${v1>=v2?'· Meets valuation':'· May be rejected'}</p>${btn('Propose Trade','tradeNow()')}</section><section class="panel"><h3>Recent Trades</h3>${S.tradeLog.slice(0,15).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<p class="muted">No trades yet.</p>'}</section>`};
tradeNow=function(){if(S.phase==='season'&&S.round>=30){toast('Trade deadline has passed');return}let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget],mine=me();let a=teamAssets(mine),b=teamAssets(other),offer=ui.offerAssets.map(k=>[...a.players,...a.picks].find(x=>x.kind+':'+x.id===k)),ask=ui.askAssets.map(k=>[...b.players,...b.picks].find(x=>x.kind+':'+x.id===k));if(!offer.length||!ask.length||[...offer,...ask].some(x=>!x)){toast('Select valid assets on both sides');return}let va=offer.reduce((n,x)=>n+x.value,0),vb=ask.reduce((n,x)=>n+x.value,0);if(va<vb&&random()>Math.exp(-(vb-va)/12)){toast('Trade rejected: insufficient value');return}function move(items,from,to){for(let x of items){if(x.kind==='p'){let p=player(x.id);from.roster=from.roster.filter(id=>id!==p.id);p.owner=to.id;to.roster.push(p.id)}else S.pickOwners[x.id]=to.id}}move(offer,mine,other);move(ask,other,mine);optLineup(mine);optLineup(other);S.tradeLog.unshift(`${mine.name} sends ${offer.map(x=>x.label).join(', ')} to ${other.name} for ${ask.map(x=>x.label).join(', ')}`);ui.offerAssets=[];ui.askAssets=[];save();toast('Trade accepted!')};
function currentOffDraftOwner(){let r=Math.floor(S.pickIndex/20)+1,origin=S.offseasonOrder[S.pickIndex%20];return S.teams[pickOwner(S.season+1,r,origin)]}
// The draft is for the upcoming season. Picks can be traded before and during it.
offPickTeam=function(){let r=Math.floor(S.pickIndex/20)+1,origin=S.offseasonOrder[S.pickIndex%20];return S.teams[pickOwner(S.season+1,r,origin)]};
const ORIGINAL_SUBMIT=submitKeepers;
submitKeepers=function(){if(me().keepers.length!==5)return;ORIGINAL_SUBMIT();if(S.phase==='offdraft'){S.draftAcquisitions={};S.draftYear=S.season+1;save()}};
const ORIGINAL_OFF_PICK=offDraftPlayer;
offDraftPlayer=function(id){if(S.phase!=='offdraft')return;let owner=offPickTeam(),p=player(id);if(!p||p.owner!==null)return;let round=Math.floor(S.pickIndex/20)+1;let count=S.draftAcquisitions[owner.id]||0;S.draftAcquisitions[owner.id]=count+1;ORIGINAL_OFF_PICK(id);if(S.phase==='rostercheck'){S.pendingYear=S.season;S.phase='rostercheck';ui.tab='home';save()}};
function fixAIRosters(){for(let t of S.teams){if(t.id===S.user)continue;while(t.roster.length>11){let worst=[...t.roster].sort((a,b)=>value(player(a))-value(player(b)))[0];release(player(worst))}while(t.roster.length<11){let p=available().sort((a,b)=>value(b)-value(a))[0];if(!p)break;assign(p,t)}optLineup(t)}}
function beginSeason(){fixAIRosters();if(me().roster.length!==11){toast('Your team needs exactly 11 Pokémon');return}S.phase='season';buildFixtures();ui.tab='home';save();render()}
const OLD_DASH=dashboard;
dashboard=function(){let top=S.phase==='rostercheck'?`<section class="panel"><h2>Finalize Season ${S.season} Roster</h2><p>You must have exactly 11 Pokémon. You currently have <b>${me().roster.length}</b>. Release extras or sign free agents before the first match.</p>${btn('Open Free Agency',"setTab('free')",'outline')} ${btn('Start New Season','beginSeason()')}</section>`:'';return top+OLD_DASH()};
// Do not allow play with invalid AI squads after uneven trades.
const OLD_PLAYROUND=playRound;
playRound=function(){fixAIRosters();OLD_PLAYROUND()};
const OLD_PLAYOFFS=playPlayoffs;
playPlayoffs=function(){fixAIRosters();OLD_PLAYOFFS()};
const OLD_RENDER=render;
render=function(){OLD_RENDER();if(S.phase==='rostercheck'){let el=document.querySelector('header .sub');if(el)el.textContent+=' · ROSTER FINALIZATION'}};

init();render();
</script></body></html>
