function newState(){return{season:1,phase:'draft',my:0,teams:NAMES.map((name,i)=>({name,roster:[],wins:0,draws:0,losses:0,gf:0,ga:0,points:0})),draftIndex:0,draftOrder:[],pool:[],fixtures:[],round:0,stats:{},history:[],growth:{},protected:[],tradeOffers:[]}}

function region(id){return id<=151?0:id<=251?1:id<=386?2:3}
function chemistry(teamIndex){let team=state.teams[teamIndex],ids=teamIndex===state.my?lineupForMine():formation(team.roster).map(p=>p.id),positions=teamIndex===state.my?selectedPositions():formation(team.roster).map(p=>p.pos);let score=0,pairs=0;for(let i=0;i<ids.length;i++){if(bestPos(ids[i])===positions[i])score+=.08;for(let j=i+1;j<ids.length;j++){pairs++;if(region(ids[i])===region(ids[j]))score+=.04;if(db[ids[i]-1]?.types.some(t=>db[ids[j]-1]?.types.includes(t)))score+=.05;if((state.pastTeams?.[ids[i]]||[]).some(t=>(state.pastTeams?.[ids[j]]||[]).includes(t)))score+=.035}}return round(score/Math.max(1,ids.length))}

function startDynasty(){if(state.draftIndex!==0)return setTab('Draft');buildDraft();autoDraft();tab='Draft';render()}
function draftPreview(){let ids=state.teams[state.my].roster;return `<div class="card"><div class="row between"><h3>Your XI · ${ids.length}/11</h3><button onclick="setTab('My Team')">Full Pitch →</button></div><div class="mini-pitch">${ids.map((id,i)=>`<div class="mini-player">${imageHTML(id)}<span>${nameFor(id)}</span></div>`).join('')}</div></div>`}

function createSchedule(){let ids=Array.from({length:20},(_,i)=>i),first=[];for(let r=0;r<19;r++){let matches=[];for(let i=0;i<10;i++){let a=ids[i],b=ids[19-i];matches.push(r%2?[b,a]:[a,b])}first.push(matches);ids=[ids[0],ids[19],...ids.slice(1,19)]}state.fixtures=[...first,...first.map(round=>round.map(([a,b])=>[b,a]))].map((games,i)=>({round:i+1,games:games.map(([home,away])=>({home,away,score:null}))}));state.round=0;state.teams.forEach(t=>Object.assign(t,{wins:0,draws:0,losses:0,gf:0,ga:0,points:0}));state.stats={};state.allStats??={};state.allTeams??=NAMES.map(()=>({wins:0,draws:0,losses:0,gf:0,ga:0,points:0,championships:0}));save()}
function poisson(l){let p=Math.exp(-l),n=0,s=1;do{n++;s*=Math.random()}while(s>p&&n<9);return n-1}
function makeResult(a,b){let x=strength(state.teams[a]),y=strength(state.teams[b]);let lambdaA=clamp(1.12+(x-y)*.85+.15,.12,3.1),lambdaB=clamp(1.12+(y-x)*.85,.12,3.1);let ga=poisson(lambdaA),gb=poisson(lambdaB);let events=[];function score(team,num){let players=formation(state.teams[team].roster).filter(p=>p.pos!==3);for(let i=0;i<num;i++){let weights=players.map(p=>p.pos===0?5:p.pos===1?2.5:.6),sum=weights.reduce((a,b)=>a+b,0),v=Math.random()*sum,idx=0;while(idx<weights.length-1&&v>weights[idx])v-=weights[idx++];let scorer=players[idx]?.id,minute=Math.floor(rand(3,91));events.push({minute,team,scorer,type:'goal'});if(scorer){state.stats[scorer]??={goals:0,assists:0,apps:0};/* statistics committed when result is applied */}if(players.length>1&&Math.random()<.73){let other=players.filter(p=>p.id!==scorer),assist=other[Math.floor(Math.random()*other.length)]?.id;if(assist){state.stats[assist]??={goals:0,assists:0,apps:0};/* statistics committed when result is applied */;events[events.length-1].assist=assist}}}}score(a,ga);score(b,gb);events.sort((x,y)=>x.minute-y.minute);return{ga,gb,events}}
function ensureRecords(){state.allStats??={};state.allTeams??=NAMES.map(()=>({wins:0,draws:0,losses:0,gf:0,ga:0,points:0,championships:0}));}
function addStat(id,key,n=1){for(let target of [state.stats,state.allStats]){target[id]??={goals:0,assists:0,apps:0,saves:0,wins:0,championships:0};target[id][key]=(target[id][key]||0)+n}}
function applyResult(g,res){if(g.score)return;ensureRecords();g.score=[res.ga,res.gb];g.events=res.events;let a=state.teams[g.home],b=state.teams[g.away];a.gf+=res.ga;a.ga+=res.gb;b.gf+=res.gb;b.ga+=res.ga;if(res.ga>res.gb){a.wins++;a.points+=3;b.losses++}else if(res.ga<res.gb){b.wins++;b.points+=3;a.losses++}else{a.draws++;b.draws++;a.points++;b.points++}for(let i of [g.home,g.away]){let t=state.teams[i],all=state.allTeams[i];for(let k of ['wins','draws','losses','gf','ga','points'])all[k]=t[k]-(t._last?.[k]||0)+(all[k]||0);t._last=Object.fromEntries(['wins','draws','losses','gf','ga','points'].map(k=>[k,t[k]]));for(let id of t.roster)addStat(id,'apps');let keeper=formation(t.roster).find(p=>p.pos===3)?.id;if(keeper){let conceded=i===g.home?res.gb:res.ga;addStat(keeper,'saves',Math.max(0,Math.round(rand(2,6)+conceded*.3)));if((i===g.home&&res.ga>res.gb)||(i===g.away&&res.gb>res.ga))addStat(keeper,'wins')}}for(let e of res.events){if(e.scorer)addStat(e.scorer,'goals');if(e.assist)addStat(e.assist,'assists')}save()}
function nextRound(){if(state.phase!=='season'||state.round>=38)return;let round=state.fixtures[state.round],mine=round.games.find(g=>g.home===state.my||g.away===state.my);round.games.forEach(g=>{if(!g.score)applyResult(g,makeResult(g.home,g.away))});if(mine)state.lastMatch={home:mine.home,away:mine.away,score:mine.score,events:mine.events,round:state.round+1};state.round++;if(state.round===38)state.phase='playoffs';save();render()}
function startWatch(){if(state.phase!=='season')return;let g=state.fixtures[state.round]?.games.find(g=>g.home===state.my||g.away===state.my);if(!g||g.score)return;let res=makeResult(g.home,g.away);viewer={g,res,minute:0,speed:1,done:false,positions:[],eventIndex:0,display:[0,0],log:[]};let a=formation(state.teams[g.home].roster),b=formation(state.teams[g.away].roster);viewer.positions=[...a.map((p,i)=>({id:p.id,side:0,x:15+(i%4)*7,y:12+Math.floor(i/4)*28})),...b.map((p,i)=>({id:p.id,side:1,x:85-(i%4)*7,y:12+Math.floor(i/4)*28}))];tab='Game Day';render();clearInterval(watchTimer);watchTimer=setInterval(tick,100)}
function tick(){if(!viewer||viewer.done){clearInterval(watchTimer);return}viewer.minute=Math.min(90,viewer.minute+0.3*viewer.speed);viewer.positions.forEach(p=>{let base=p.side===0?33:67;p.x=clamp(p.x*.82+base*.18+rand(-5,5),5,95);p.y=clamp(p.y+rand(-7,7),7,93)});while(viewer.eventIndex<viewer.res.events.length&&viewer.res.events[viewer.eventIndex].minute<=viewer.minute){let e=viewer.res.events[viewer.eventIndex++];viewer.display[e.team===viewer.g.home?0:1]++;viewer.log.unshift(`${e.minute}' ⚽ GOAL! ${nameFor(e.scorer)} (${state.teams[e.team].name})${e.assist?' · Assist: '+nameFor(e.assist):''}`)}if(viewer.minute>=90)finishWatch();else drawViewer()}
function finishWatch(){if(!viewer||viewer.done)return;viewer.minute=90;viewer.display=[viewer.res.ga,viewer.res.gb];viewer.done=true;clearInterval(watchTimer);applyResult(viewer.g,viewer.res);let round=state.fixtures[state.round];round.games.filter(g=>!g.score).forEach(g=>applyResult(g,makeResult(g.home,g.away)));state.lastMatch={home:viewer.g.home,away:viewer.g.away,score:viewer.g.score,events:viewer.g.events,round:state.round+1};state.round++;if(state.round>=38)state.phase='playoffs';save();render()}

function tradesView(){return `<div class="card"><h2>Trades</h2><p>Propose a one-for-one Pokémon trade. The computer considers positional strength and team needs.</p><div class="controls"><select id="tradeMine">${state.teams[state.my].roster.map(id=>`<option value="${id}">${nameFor(id)}</option>`).join('')}</select><select id="tradeTeam" onchange="renderTradeTargets()">${NAMES.map((n,i)=>i===state.my?'':`<option value="${i}">${n}</option>`).join('')}</select><select id="tradeTarget"></select><button class="primary" onclick="proposeTrade()">Offer Trade</button></div><p class="small">Offseason trades and draft-pick exchanges are planned for a later update.</p></div>`}
function renderTradeTargets(){let e=document.getElementById('tradeTeam'),out=document.getElementById('tradeTarget');if(!e||!out)return;out.innerHTML=state.teams[+e.value].roster.map(id=>`<option value="${id}">${nameFor(id)}</option>`).join('')}
function proposeTrade(){let a=+document.getElementById('tradeMine').value,b=+document.getElementById('tradeTarget').value,t=+document.getElementById('tradeTeam').value;if(!a||!b)return toast('Select both players');if(Math.max(...db[a-1].ratings)+.5<Math.max(...db[b-1].ratings))return toast('Trade rejected: insufficient value');state.teams[state.my].roster=state.teams[state.my].roster.map(x=>x===a?b:x);state.teams[t].roster=state.teams[t].roster.map(x=>x===b?a:x);state.lineup=null;save();toast('Trade accepted!');render()}
function historyView(){return `<div class="card"><h2>Dynasty History</h2>${state.history.length?state.history.map(h=>`<p>Season ${h.season}: 🏆 ${NAMES[h.winner]}</p>`).join(''):'Your dynasty history starts after the first championship.'}</div>`}
function runPlayoffs(){let seeds=sortedTeams().slice(0,6).map(t=>t.i);function series(a,b){let w=[0,0];while(Math.max(...w)<2){let r=makeResult(a,b),x=r.ga,y=r.gb;if(x===y){Math.random()<.5?x++:y++}w[x>y?0:1]++}return w[0]>w[1]?a:b}let q1=series(seeds[2],seeds[5]),q2=series(seeds[3],seeds[4]);let lower=seeds.indexOf(q1)>seeds.indexOf(q2)?q1:q2,other=lower===q1?q2:q1;let s1=series(seeds[0],lower),s2=series(seeds[1],other),winner=series(s1,s2);ensureRecords();state.history.push({season:state.season,winner});state.allTeams[winner].championships++;for(let id of state.teams[winner].roster)addStat(id,'championships');state.phase='offseason';save();toast(`${NAMES[winner]} win the championship!`);render()}
function startOffseason(){state.season++;for(let t of state.teams){t.roster=t.roster.sort((a,b)=>Math.max(...db[b-1].ratings)-Math.max(...db[a-1].ratings)).slice(0,5)}for(let t of state.teams)for(let id of t.roster)state.growth[id]=round(clamp((state.growth[id]||0)+rand(-.12,.23),-.8,1.3));let taken=new Set(state.teams.flatMap(t=>t.roster));let pool=db.filter(p=>!taken.has(p.id)&&(baseStage(p.id))).map(p=>p.id);state.pool=pool;state.draftOrder=[];let order=sortedTeams().reverse().map(t=>t.i);for(let r=0;r<6;r++)state.draftOrder.push(...(r%2?[...order].reverse():order));state.draftIndex=0;state.phase='draft';state.lineup=null;state.fixtures=[];save();toast('New season draft started');render()}
init();setTimeout(()=>{if(tab==='Trades')renderTradeTargets()},50);
</script></body></html>
