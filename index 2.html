function draftView(){let initial=S.phase==='draft',active=initial||S.phase==='offdraft';if(!active)return `<section class="panel"><h2>Draft Room</h2><p>No draft is currently active.</p></section>`;let t=initial?currentPickTeam():offPickTeam(),round=Math.floor(S.pickIndex/20)+1,number=S.pickIndex%20+1;let pool=available().filter(p=>pname(p).toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>value(b)-value(a));return `<div class="between"><h2>${initial?'Initial Snake Draft':'Offseason Draft'} · Round ${round}</h2><span class="pill">Pick ${number}/20 · ${esc(t.name)}</span></div><div class="toolbar">${btn('Skip to My Pick',initial?'skipPick(false)':'skipOff(false)','outline')}${btn('Autodraft Remaining',initial?'skipPick(true)':'skipOff(true)','outline')}</div><div class="grid"><section class="panel"><div class="between"><h3>Available Pokémon (${available().length})</h3><span class="badge">${initial?'11 rounds · snake':'6 rounds · fixed order'}</span></div><input id="search" placeholder="Search Pokémon" value="${esc(ui.search)}" oninput="ui.search=this.value;updatePool()"><div id="pool" class="scroll">${poolMarkup(pool,t,initial)}</div></section><section class="panel"><h3>Your Live XI (${me().roster.length}/11)</h3>${lineup(me())}<div class="toolbar">${btn('Optimize XI','autoBest()','outline')}</div><h3>Recent Selections</h3><div class="scroll">${(initial?S.log:S.draftHistory.slice().reverse()).slice(0,8).map(x=>`<div class="item small">${esc(x)}</div>`).join('')}</div></section></div>`}
function poolMarkup(pool,t,initial){return pool.map(p=>`<div class="item"><div><div class="name">${esc(pname(p))} <span class="muted small">${family(p).type}</span></div><div class="muted small">ST ${rate(p,0).toFixed(1)} · MID ${rate(p,1).toFixed(1)} · DEF ${rate(p,2).toFixed(1)} · GK ${rate(p,3).toFixed(1)} · POT ${p.potential.toFixed(1)} · CHEM +${chemistry(p).toFixed(2)} · Value ${value(p)}</div><div class="badge">${esc(family(p).forms.join(' → '))}</div></div>${t.id===S.user?btn('Draft',`${initial?'draftPlayer':'offDraftPlayer'}(${p.id})`,'tinybtn'):''}</div>`).join('')||'<p class="muted">No available Pokémon.</p>'}function updatePool(){let t=S.phase==='draft'?currentPickTeam():offPickTeam();document.getElementById('pool').innerHTML=poolMarkup(available().filter(p=>pname(p).toLowerCase().includes(ui.search.toLowerCase())).sort((a,b)=>value(b)-value(a)),t,S.phase==='draft')}
function keepers(){if(S.phase!=='offseason')return `<section class="panel"><h2>Keeper Selection</h2><p>Keeper selection opens after the playoffs.</p></section>`;return `<section class="panel"><h2>Choose Your Five Keepers</h2><p class="muted">Select exactly five Pokémon. The other six return to free agency. Draft begins immediately after submission.</p><div class="pill">${me().keepers.length}/5 selected</div>${me().roster.map(id=>{let p=player(id);return `<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">Potential ${p.potential.toFixed(1)} · Trade ${value(p)}</div></div>${btn(me().keepers.includes(id)?'Selected ✓':'Keep',`keeperToggle(${id})`,me().keepers.includes(id)?'':'outline')}</div>`}).join('')}<div class="toolbar" style="margin-top:15px">${btn('Submit 5 & Start Draft','submitKeepers()',me().keepers.length===5?'':'outline')}</div></section>`}
function standingsView(){return `<section class="panel"><h2>League Standings · Season ${S.season}</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${standings().map((t,i)=>`<tr class="${t.id===S.user?'mine':''}"><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.wins+t.draws+t.losses}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${points(t)}</b></td></tr>`).join('')}</tbody></table></div></section>`}
function statsView(){let t=me(),sort=ui.stats,season=ui.seasonStats;let categories=[['goals','Goals'],['assists','Assists'],['points','Points'],['winpct','Win%'],['saves','Saves'],['shutouts','Shutouts'],['wins','Wins']];let ranked=[...S.players].filter(p=>(season?p.seasonStats:p.stats)?.gp>0).sort((a,b)=>metric(b,sort,season)-metric(a,sort,season));return `<section class="panel"><div class="flex" style="justify-content:space-between;align-items:center;flex-wrap:wrap"><h2>LEADERS</h2><div class="toolbar">${btn('SEASON '+S.season,'ui.seasonStats=true;render()',season?'':'outline')}${btn('ALL-TIME','ui.seasonStats=false;render()',!season?'':'outline')}</div></div><div class="toolbar">${categories.map(([k,label])=>btn(label,`ui.stats='${k}';render()`,sort===k?'':'outline')).join('')}</div><div style="overflow:auto"><table><tr><th>#</th><th>Pokémon</th><th>Club</th><th>GP</th><th>${categories.find(x=>x[0]===sort)?.[1]||'Goals'}</th></tr>${ranked.slice(0,50).map((p,i)=>`<tr><td>${i+1}</td><td><div class="flex" style="align-items:center;gap:8px">${pokemonImage(pname(p),true)} <b>${esc(pname(p))}</b></div></td><td>${p.owner===null?'FA':esc(S.teams[p.owner].name)}</td><td>${(season?p.seasonStats:p.stats).gp}</td><td class="accent"><b>${sort==='winpct'?metric(p,sort,season).toFixed(1)+'%':metric(p,sort,season)}</b></td></tr>`).join('')}</table></div></section><section class="panel"><h3>${esc(t.name)} · Season-by-season</h3><table><tr><th>Season</th><th>W-D-L</th><th>GF</th><th>GA</th><th>Champion</th></tr>${t.history.map(h=>`<tr><td>${h.season}</td><td>${h.w}-${h.d}-${h.l}</td><td>${h.gf}</td><td>${h.ga}</td><td>${h.champ?'★':'—'}</td></tr>`).join('')}</table></section>`}function metric(p,k,season=false){let s=season?p.seasonStats:p.stats;if(!s)return 0;return k==='winpct'?(s.gp?s.w/s.gp*100:0):k==='points'?(s.g||0)+(s.a||0):k==='wins'?(s.w||0):k==='shutouts'?(s.so||0):k==='goals'?(s.g||0):k==='assists'?(s.a||0):k==='saves'?(s.saves||0):0}
function faView(){let pool=available().sort((a,b)=>value(b)-value(a));return `<div class="grid"><section class="panel"><h2>Free Agency (${pool.length})</h2><p class="muted">Release one player before signing if your roster has 11.</p><div class="scroll">${pool.slice(0,100).map(p=>`<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">${Math.max(...p.ratings).toFixed(1)} best · ${family(p).type}</div></div>${btn('Sign',`sign(${p.id})`,'tinybtn')}</div>`).join('')}</div></section><section class="panel"><h2>Your Roster (${me().roster.length}/11)</h2>${me().roster.map(id=>{let p=player(id);return `<div class="item"><div><b>${esc(pname(p))}</b><div class="muted small">Trade value ${value(p)}</div></div>${btn('Release',`drop(${id})`,'outline tinybtn danger')}</div>`}).join('')}</section></div>`}
function tradeView(){let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget];if(!other)other=S.teams[(S.user+1)%20];return `<section class="panel"><h2>Trade Centre</h2><p class="muted">Trades close after Matchweek 30. Pokémon retain their evolution when traded.</p><div class="flex"><label>Trade partner</label><select onchange="ui.tradeTarget=+this.value;ui.tradeOffer=null;ui.tradeAsk=null;render()">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}" ${other.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="grid" style="margin-top:14px"><div><h3>Offer One Pokémon</h3>${me().roster.map(id=>{let p=player(id);return `<div class="item ${ui.tradeOffer===id?'selected':''}" onclick="ui.tradeOffer=${id};render()"><span>${esc(pname(p))}</span><span class="accent">${value(p)}</span></div>`}).join('')}</div><div><h3>Request One Pokémon</h3>${other.roster.map(id=>{let p=player(id);return `<div class="item ${ui.tradeAsk===id?'selected':''}" onclick="ui.tradeAsk=${id};render()"><span>${esc(pname(p))}</span><span class="accent">${value(p)}</span></div>`}).join('')}</div></div><div class="toolbar" style="margin-top:14px">${btn('Propose Trade','tradeNow()')}</div></section>`}
function tradeNow(){if(S.phase==='season'&&S.round>=30){toast('Trade deadline has passed.');return}if(ui.tradeOffer===null||ui.tradeAsk===null){toast('Choose a Pokémon from each team.');return}let a=player(ui.tradeOffer),b=player(ui.tradeAsk),other=S.teams[b.owner];let odds=value(a)>=value(b)?1:Math.exp(-(value(b)-value(a))/17);if(random()>odds){toast('Trade rejected by '+other.name);return}let mine=me();other.roster=other.roster.filter(x=>x!==b.id);mine.roster=mine.roster.filter(x=>x!==a.id);a.owner=other.id;b.owner=mine.id;other.roster.push(a.id);mine.roster.push(b.id);optLineup(other);optLineup(mine);ui.tradeOffer=ui.tradeAsk=null;toast('Trade accepted!');save()}
function playoffsView(){return `<section class="panel"><h2>Playoffs · Season ${S.season}</h2><p class="muted">Top 10 qualify · Reseeded highest vs lowest each round · Best of 1 / 3 / 5 / 7 / 7</p>${S.playoffRounds.map((r,i)=>`<h3>${['Play-in','Qualifying','Quarterfinals','Semifinals','Championship'][i]}</h3>${r.map(s=>`<div class="item"><span>${esc(S.teams[s.a].name)} ${s.aw}</span><b>vs</b><span>${s.bw} ${esc(S.teams[s.b].name)}</span><span class="pill">${esc(S.teams[s.winner].name)} advances</span></div>`).join('')}`).join('')}${S.phase==='playoffs'?btn('Simulate Next Round','playPlayoffs()'):''}${S.champion!==null?`<h2 class="accent">🏆 ${esc(S.teams[S.champion].name)} — Champions</h2>`:''}</section>`}
function eeveeView(){let ee=S.players.find(p=>family(p).forms[0]==='Eevee');return `<section class="panel"><h2>Eevee Legacy</h2><p>At season's end, Eevee's owner chooses a new Eeveelution. That form becomes a permanent independent player. Eevee returns to the pool until all seven are active.</p><p>Active forms: ${S.eeveeUnlocked.join(', ')||'None'}</p><p class="accent">${S.eeveeUnlocked.length}/7 unlocked</p>${S.phase==='offseason'&&ee.owner===S.user?EEVEES.filter(x=>!S.eeveeUnlocked.includes(x)).map(x=>btn(x,`evolveEevee('${x}')`,'outline')).join(' '):'<p class="muted">Evolution choice appears here when you own Eevee at season end.</p>'}</section>`}function evolveEevee(name){if(S.phase!=='offseason'||S.eeveeUnlocked.includes(name))return;let ee=S.players.find(p=>family(p).forms[0]==='Eevee'),owner=ee.owner;if(owner===null)return;let p={...structuredClone(ee),id:S.nextPlayerId++,custom:name,stage:0,owner:null};p.stats={gp:0,w:0,d:0,g:0,a:0,shots:0,saves:0,so:0};p.seasonStats={...p.stats};p.ratings=p.ratings.map(x=>clamp(x+1,5,10));S.players.push(p);release(ee);assign(p,S.teams[owner]);S.eeveeUnlocked.push(name);S.freeEevee=S.eeveeUnlocked.length<7;S.players.filter(x=>x.custom).forEach(x=>x.growth=clamp(x.growth+.1,-.5,1.5));save();render()}
function setup(){return `<section class="panel"><h2>Start Your Dynasty</h2><p class="muted">20 clubs. 11 Pokémon per team. Random 11-round snake draft. 38-match seasons and ten-team reseeded playoffs.</p><label>Choose your club</label><p><select id="teamSelect">${NAMES.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select></p>${btn('Begin Random Draft','start()')}<p class="muted small">Progress saves automatically in this browser.</p></section>`}
function render(){let app=document.getElementById('app');if(!S)init();let tabs=[['home','XI Dynasty'],['draft','Draft'],['lineup','My Team'],['schedule','Schedule'],['standings','Table'],['playoffs','Playoffs'],['stats','Stats'],['trades','Trades'],['free','Free Agency'],['keepers','Keepers']];app.innerHTML=`<header><div><div class="logo">POKÉMON <span>XI</span></div><div class="sub small">DYNASTY MANAGER · ${S.phase==='setup'?'NEW LEAGUE':esc(me().name)+' · SEASON '+S.season}</div></div><div class="flex"><span class="pill">Autosave On</span>${btn('New Dynasty','resetGame()','outline tinybtn')}</div></header>${S.phase==='setup'?setup():`<nav class="tabs">${tabs.map(([id,label])=>btn(label,`setTab('${id}')`,ui.tab===id?'active':'')).join('')}</nav>${ui.tab==='home'?dashboard():ui.tab==='draft'?draftView():ui.tab==='lineup'?`<div class="grid"><section class="panel"><h2>Lineup Editor</h2>${lineup(me())}<p class="muted">Tap two positions to swap Pokémon.</p>${btn('Optimize XI','autoBest()')}</section><section class="panel"><h3>Player Ratings</h3>${me().roster.map(id=>{let p=player(id);return `<div class="item"><b>${esc(pname(p))}</b><span class="muted small">ST ${rate(p,0).toFixed(1)} · MID ${rate(p,1).toFixed(1)} · DEF ${rate(p,2).toFixed(1)} · GK ${rate(p,3).toFixed(1)} · POT ${p.potential.toFixed(1)} · CHEM +${chemistry(p).toFixed(2)}</span></div>`}).join('')}</section></div>`:ui.tab==='schedule'?scheduleView():ui.tab==='standings'?standingsView():ui.tab==='playoffs'?playoffsView():ui.tab==='keepers'?keepers():ui.tab==='trades'?tradeView():ui.tab==='free'?faView():ui.tab==='stats'?statsView():dashboard()}`}${ui.notice?`<div class="toast">${esc(ui.notice)}</div>`:''}<p class="muted small" style="text-align:center">Playable browser build · Deterministic seeded simulations · Local autosave · No Supabase connection configured</p>`}
function resetGame(){if(confirm('Delete this dynasty and start again?')){localStorage.removeItem(KEY);S=null;ui.tab='home';init();render()}}
// Dynasty expansion: transferable future picks, variable-asset trades and roster reconciliation.
const OLD_INIT=init;
init=function(){OLD_INIT();if(!S.pickOwners)S.pickOwners={};if(!S.tradeLog)S.tradeLog=[];if(!S.playerSeasonHistory)S.playerSeasonHistory={};if(!S.draftAcquisitions)S.draftAcquisitions={};if(!S.pendingYear)S.pendingYear=null;S.players.forEach(p=>{if(p.legendary){p.ratings=p.ratings.map((x,i)=>Math.max(x,8.0+(Math.sin(p.id*11+i*7)+1)*.72));p.potential=Math.max(p.potential,9)} });save()};
const BASE_SAVE=save;
save=function(){if(S)BASE_SAVE()};
function pickKey(year,round,origin){return year+'-'+round+'-'+origin}
function pickOwner(year,round,origin){let k=pickKey(year,round,origin);return S.pickOwners[k]===undefined?origin:S.pickOwners[k]}
function ownedPicks(teamId){let out=[];for(let y=S.season+1;y<=S.season+3;y++)for(let r=1;r<=6;r++)for(let origin=0;origin<20;origin++)if(pickOwner(y,r,origin)===teamId)out.push({year:y,round:r,origin,key:pickKey(y,r,origin)});return out}
function pickVal(x){let delay=Math.max(0,x.year-S.season),base=[0,27,23,19,15,12,9][x.round];let rank=standings().findIndex(t=>t.id===x.origin);let posFactor=1.2-.4*(19-rank)/19;return Math.round(base*posFactor*Math.pow(.78,delay))}
function teamAssets(t){return {players:t.roster.map(id=>({kind:'p',id,label:pname(player(id)),value:value(player(id))})),picks:ownedPicks(t.id).map(x=>({kind:'k',id:x.key,label:`Y${x.year} R${x.round} · ${S.teams[x.origin].name}`,value:pickVal(x)}))}}
ui.offerAssets=[];ui.askAssets=[];
function toggleAsset(side,kind,id){let key=kind+':'+id,arr=side==='offer'?ui.offerAssets:ui.askAssets;let i=arr.indexOf(key);if(i>=0)arr.splice(i,1);else arr.push(key);render()}
function assetMarkup(t,side){let assets=teamAssets(t);return `<h4>Pokémon (${assets.players.length})</h4>${assets.players.map(a=>assetRow(a,side)).join('')}<h4>Draft Picks (${assets.picks.length})</h4><div class="scroll" style="max-height:220px">${assets.picks.map(a=>assetRow(a,side)).join('')}</div>`}
function assetRow(a,side){let key=a.kind+':'+a.id,selected=(side==='offer'?ui.offerAssets:ui.askAssets).includes(key);return `<div class="item ${selected?'selected':''}" onclick="toggleAsset('${side}','${a.kind}','${a.id}')"><span>${selected?'☑':'□'} ${esc(a.label)}</span><b class="accent">${a.value}</b></div>`}
tradeView=function(){let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget];if(!other)other=S.teams[(S.user+1)%20];let av=teamAssets(me()),bv=teamAssets(other);let v1=ui.offerAssets.reduce((n,k)=>n+([...av.players,...av.picks].find(a=>a.kind+':'+a.id===k)?.value||0),0),v2=ui.askAssets.reduce((n,k)=>n+([...bv.players,...bv.picks].find(a=>a.kind+':'+a.id===k)?.value||0),0);return `<section class="panel"><h2>Trade Centre · Unlimited Asset Combinations</h2><p class="muted">Trade Pokémon and picks up to three seasons ahead. No equal asset-count requirement. Trades close after matchweek 30. Fix roster sizes before kickoff.</p><label>Trade partner</label><select onchange="ui.tradeTarget=+this.value;ui.offerAssets=[];ui.askAssets=[];render()">${S.teams.filter(t=>t.id!==S.user).map(t=>`<option value="${t.id}" ${other.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="grid"><section><h3>You offer · ${v1} value</h3>${assetMarkup(me(),'offer')}</section><section><h3>You request · ${v2} value</h3>${assetMarkup(other,'ask')}</section></div><p><b>Value: ${v1} offered / ${v2} requested</b> ${v1>=v2?'· Meets valuation':'· May be rejected'}</p>${btn('Propose Trade','tradeNow()')}</section><section class="panel"><h3>Recent Trades</h3>${S.tradeLog.slice(0,15).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<p class="muted">No trades yet.</p>'}</section>`};
tradeNow=function(){if(S.phase==='season'&&S.round>=30){toast('Trade deadline has passed');return}let other=S.teams[ui.tradeTarget===S.user?(S.user+1)%20:ui.tradeTarget],mine=me();let a=teamAssets(mine),b=teamAssets(other),offer=ui.offerAssets.map(k=>[...a.players,...a.picks].find(x=>x.kind+':'+x.id===k)),ask=ui.askAssets.map(k=>[...b.players,...b.picks].find(x=>x.kind+':'+x.id===k));if(!offer.length||!ask.length||[...offer,...ask].some(x=>!x)){toast('Select valid assets on both sides');return}let va=offer.reduce((n,x)=>n+x.value,0),vb=ask.reduce((n,x)=>n+x.value,0);if(va<vb&&random()>Math.exp(-(vb-va)/12)){toast('Trade rejected: insufficient value');return}function move(items,from,to){for(let x of items){if(x.kind==='p'){let p=player(x.id);from.roster=from.roster.filter(id=>id!==p.id);p.owner=to.id;to.roster.push(p.id)}else S.pickOwners[x.id]=to.id}}move(offer,mine,other);move(ask,other,mine);optLineup(mine);optLineup(other);S.tradeLog.unshift(`${mine.name} sends ${offer.map(x=>x.label).join(', ')} to ${other.name} for ${ask.map(x=>x.label).join(', ')}`);ui.offerAssets=[];ui.askAssets=[];save();toast('Trade accepted!')};
function currentOffDraftOwner(){let r=Math.floor(S.pickIndex/20)+1,origin=S.offseasonOrder[S.pickIndex%20];return S.teams[pickOwner(S.season+1,r,origin)]}
// The draft is for the upcoming season. Picks can be traded before and during it.
offPickTeam=function(){let r=Math.floor(S.pickIndex/20)+1,origin=S.offseasonOrder[S.pickIndex%20];return S.teams[pickOwner(S.season+1,r,origin)]};
const ORIGINAL_SUBMIT=submitKeepers;
submitKeepers=function(){if(me().keepers.length!==5)return;ORIGINAL_SUBMIT();if(S.phase==='offdraft'){S.draftAcquisitions={};S.draftYear=S.season+1;save()}};
const ORIGINAL_OFF_PICK=offDraftPlayer;
offDraftPlayer=function(id){if(S.phase!=='offdraft')return;let owner=offPickTeam(),p=player(id);if(!p||p.owner!==null)return;let round=Math.floor(S.pickIndex/20)+1;let count=S.draftAcquisitions[owner.id]||0;S.draftAcquisitions[owner.id]=count+1;ORIGINAL_OFF_PICK(id);if(S.phase==='rostercheck'){S.pendingYear=S.season;S.phase='rostercheck';ui.tab='home';save()}};
function fixAIRosters(){for(let t of S.teams){if(t.id===S.user)continue;while(t.roster.length>11){let worst=[...t.roster].sort((a,b)=>value(player(a))-value(player(b)))[0];release(player(worst))}while(t.roster.length<11){let p=available().sort((a,b)=>value(b)-value(a))[0];if(!p)break;assign(p,t)}optLineup(t)}}
function beginSeason(){fixAIRosters();if(me().roster.length!==11){toast('Your team needs exactly 11 Pokémon');return}S.phase='season';buildFixtures();ui.tab='home';save();render()}
const OLD_DASH=dashboard;
dashboard=function(){let top=S.phase==='rostercheck'?`<section class="panel"><h2>Finalize Season ${S.season} Roster</h2><p>You must have exactly 11 Pokémon. You currently have <b>${me().roster.length}</b>. Release extras or sign free agents before the first match.</p>${btn('Open Free Agency',"setTab('free')",'outline')} ${btn('Start New Season','beginSeason()')}</section>`:'';return top+OLD_DASH()};
// Do not allow play with invalid AI squads after uneven trades.
const OLD_PLAYROUND=playRound;
playRound=function(){fixAIRosters();OLD_PLAYROUND()};
const OLD_PLAYOFFS=playPlayoffs;
playPlayoffs=function(){fixAIRosters();OLD_PLAYOFFS()};
const OLD_RENDER=render;
render=function(){OLD_RENDER();if(S.phase==='rostercheck'){let el=document.querySelector('header .sub');if(el)el.textContent+=' · ROSTER FINALIZATION'}};


// Visual and scoring refinements to match the supplied reference.
const CLUB_MASCOTS=['absol','arceus','vileplume','infernape','tangela','venusaur','lucario','palkia','eevee','machamp','ho-oh','ivysaur','unown','empoleon','manectric','machamp','zubat','forretress','houndoom','togepi'];
const POKE_ALIAS={HoOh:'ho-oh',MrMime:'mr-mime',Farfetchd:'farfetchd',NidoranF:'nidoran-f',NidoranM:'nidoran-m',PorygonZ:'porygon-z',Deoxys:'deoxys-normal',Wormadam:'wormadam-plant'};
function sprite(name){let slug=POKE_ALIAS[name]||String(name).replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase().replace(/[^a-z0-9-]/g,'');return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/'+slug+'.gif'}
function fallbackSprite(img){if(img.dataset.fallback)return;img.dataset.fallback='1';let slug=img.dataset.slug;img.src='https://play.pokemonshowdown.com/sprites/dex/'+slug+'.png';img.onerror=function(){this.onerror=null;this.style.display='none'}}
function pokemonImage(name,small=false){let slug=POKE_ALIAS[name]||String(name).replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase().replace(/[^a-z0-9-]/g,'');return `<img class="poke-thumb ${small?'sm':''}" loading="lazy" alt="${esc(name)}" data-slug="${slug}" src="${sprite(name)}" onerror="fallbackSprite(this)">`}
function crest(t,small=true){return pokemonImage(CLUB_MASCOTS[t.id]||'pikachu',small)}
value=function(p){let best=Math.max(...[0,1,2,3].map(i=>rate(p,i)));let future=Math.max(best,p.potential+(p.legendary?0:Math.max(0,family(p).forms.length-1-p.stage)*.18));return Math.round(clamp((best*.65+future*.35)*10,50,100))};
lineup=function(t){let rows=[[9,10],[5,6,7,8],[1,2,3,4],[0]];return `<div class="field">${rows.map(row=>`<div class="fieldrow">${row.map(i=>{let p=player(t.formation[i]);return `<div class="slot ${ui.slot===i?'active':''}" onclick="swapSlot(${i})">${p?pokemonImage(pname(p)):''}<strong>${p?esc(pname(p)):'Empty'}</strong><span class="rating">${['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','ST','ST'][i]} ${p?rate(p,position(i)).toFixed(1):'—'} ${p?'+'+chemistry(p).toFixed(1):''}</span></div>`}).join('')}</div>`).join('')}</div>`};
poolMarkup=function(pool,t,initial){return pool.map(p=>`<div class="item">${pokemonImage(pname(p))}<div class="poke-info"><div class="poke-name">${esc(pname(p))} ${p.legendary?'<span class="badge">LEGEND</span>':''}</div><div class="poke-meta">${esc(family(p).type)} · ${esc(family(p).region)} · Best ${['ST','MID','DEF','GK'][p.ratings.indexOf(Math.max(...p.ratings))]} · Potential ${p.potential.toFixed(1)}</div><div class="ratings">${['ST','MID','DEF','GK'].map((n,i)=>`<span>${n} <b>${rate(p,i).toFixed(1)}</b></span>`).join('')}</div></div>${t.id===S.user?btn('DRAFT',`${initial?'draftPlayer':'offDraftPlayer'}(${p.id})`,'tinybtn'):''}</div>`).join('')||'<p class="muted">No available Pokémon.</p>'};
standingsView=function(){return `<section class="panel"><h2>Season ${S.season} Table</h2><div style="overflow:auto"><table class="standings-table"><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${standings().map((t,i)=>`<tr class="${t.id===S.user?'mine':''} ${i===10?'cutline':''}"><td>${i+1}</td><td>${crest(t)} ${esc(t.name)}</td><td>${t.wins+t.draws+t.losses}</td><td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td>${points(t)}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Top 10 qualify · Reseeding every playoff round</p></section>`};
ui.week=ui.week||0;
function scheduleView(){if(!S.fixtures?.length)return `<section class="panel"><h2>Schedule</h2><p>Fixtures are generated when the season begins.</p></section>`;let w=clamp(ui.week,0,37),games=S.fixtures[w],results=S.results[w];return `<section class="panel"><div class="between"><h2>Season ${S.season}</h2><div class="toolbar"></div></div><div class="season-nav">${btn('‹',`ui.week=Math.max(0,ui.week-1);render()`)}<b>ROUND ${w+1}</b>${btn('›',`ui.week=Math.min(37,ui.week+1);render()`)}</div>${games.map(([a,b],i)=>{let m=results?.[i];return `<div class="fixture"><div class="side"><span>${esc(S.teams[a].name)}</span>${crest(S.teams[a])}</div><div class="result">${m?m.hg+'–'+m.ag:'–'}</div><div class="side">${crest(S.teams[b])}<span>${esc(S.teams[b].name)}</span></div></div>`}).join('')}</section><section class="panel"><h3>My Fixtures</h3>${S.fixtures.map((round,i)=>{let pair=round.find(([a,b])=>a===S.user||b===S.user);if(!pair)return '';let opp=S.teams[pair.find(x=>x!==S.user)],m=S.results[i]?.find(g=>(g.a===S.user||g.b===S.user));return `<div class="item"><span>R${i+1} ${pair[0]===S.user?'vs':'@'} ${esc(opp.name)}</span><b>${m?m.hg+'–'+m.ag:'—'}</b></div>`}).join('')}</section>`}
function simWeeks(n){let count=0;while(S.phase==='season'&&count++<n)playRound();ui.week=Math.max(0,Math.min(37,S.round-1));render()}
const OLD_STATS_VIEW=statsView;
statsView=function(){let html=OLD_STATS_VIEW();return html.replace(/<td>([^<]+)<\/td><td>(FA|[^<]+)<\/td>/g,(m,name,team)=>{let p=S.players.find(x=>pname(x)===name);return p?`<td>${pokemonImage(name,true)} ${esc(name)}</td><td>${team}</td>`:m})};
const OLD_PLAYOFFS_VIEW=playoffsView;
playoffsView=function(){return OLD_PLAYOFFS_VIEW().replace(/<span>([^<>]+) (\d+)<\/span>/g,(m,n,score)=>{let t=S.teams.find(x=>x.name===n);return t?`<span>${crest(t)} ${esc(n)} ${score}</span>`:m})};
const OLD_RENDER_VISUAL=render;
render=function(){OLD_RENDER_VISUAL();if(S.phase==='season'&&ui.tab==='schedule'&&ui.week===0&&S.round>0)ui.week=S.round-1};


// Streamlined four-stage navigation. Gameplay engines and saved progress remain intact.
const STAGE_RENDER_ORIGINAL=render;
function stageTab(tab){ui.tab=tab;render()}
function stageSetup(){return `<div class="stage-wrap"><p class="stage-eyebrow">A new dynasty begins</p><h1 class="stage-title">Choose your club</h1><p class="stage-desc">20 clubs. One legacy. Select a team to enter the opening draft.</p><div class="team-choice">${NAMES.map((n,i)=>`<label><input type="radio" name="club" value="${i}" ${i===0?'checked':''}><span>${esc(n)}</span></label>`).join('')}</div><div class="stage-start">${btn('Begin Draft','stageStart()')}</div></div>`}
function stageStart(){let selected=document.querySelector('input[name="club"]:checked');let select=document.createElement('select');select.id='teamSelect';select.innerHTML=`<option value="${selected?selected.value:0}">Selected</option>`;document.body.appendChild(select);start();select.remove()}
function stageSeason(){let t=me(),st=standings(),rank=st.findIndex(x=>x.id===t.id)+1;let tabs=[['trades','Trades'],['lineup','Roster'],['standings','Standings'],['stats','Stats'],['schedule','Schedule']];let active=tabs.some(x=>x[0]===ui.tab)?ui.tab:'schedule';ui.tab=active;let content=active==='trades'?tradeView():active==='lineup'?`<div class="grid"><section class="panel"><h2>Starting XI</h2>${lineup(t)}<p class="muted">Tap two Pokémon to swap positions.</p>${btn('Optimize XI','autoBest()')}</section><section class="panel"><h3>Squad · ${t.roster.length}/11</h3>${t.roster.map(id=>{let p=player(id);return `<div class="item">${pokemonImage(pname(p),true)}<div><b>${esc(pname(p))}</b><div class="muted small">ST ${rate(p,0).toFixed(1)} · MID ${rate(p,1).toFixed(1)} · DEF ${rate(p,2).toFixed(1)} · GK ${rate(p,3).toFixed(1)} · POT ${p.potential.toFixed(1)}</div></div></div>`}).join('')}</section></div>`:active==='standings'?(S.phase==='playoffs'?playoffsView():standingsView()):active==='stats'?statsView():scheduleView();return `<div class="stage-wrap"><p class="stage-eyebrow">Season ${S.season} · ${S.phase==='playoffs'?'Playoffs':'Regular season'}</p><div class="stage-hero"><div class="muted small">YOUR CLUB</div><div class="hero-name">${esc(t.name)}</div><div class="stage-metrics"><div class="stage-metric"><strong>${rank}${rank===1?'st':rank===2?'nd':rank===3?'rd':'th'}</strong><small>League rank</small></div><div class="stage-metric"><strong>${points(t)}</strong><small>Points</small></div><div class="stage-metric"><strong>${t.wins}-${t.draws}-${t.losses}</strong><small>W-D-L</small></div><div class="stage-metric"><strong>${S.round}/38</strong><small>Matchweeks</small></div></div>${S.phase==='season'?btn('Simulate Next Matchweek →','playRound()'):btn('Simulate Next Playoff Round →','playPlayoffs()')}</div><div class="stage-tabs">${tabs.map(([id,label])=>btn(label,`stageTab('${id}')`,active===id?'active':'outline')).join('')}</div><div class="stage-content">${content}</div></div>`}
function stageOffseason(){let keeperPhase=S.phase==='offseason',draftPhase=S.phase==='offdraft';let content=keeperPhase?keepers():draftPhase?draftView():dashboard();return `<div class="stage-wrap"><p class="stage-eyebrow">Offseason · Year ${S.season}</p><h1 class="stage-title">${keeperPhase?'Choose your five returning Pokémon':draftPhase?'Offseason Draft':'Finalize your roster'}</h1><p class="stage-desc">${keeperPhase?'Choose five players to retain. Everyone else returns to the draft pool.':draftPhase?'Rebuild your squad with draft picks and trades.':'Exactly 11 Pokémon are required to start the season.'}</p>${S.phase==='rostercheck'?`<div class="stage-actions">${btn('Roster',"stageTab('lineup')")}${btn('Free Agency',"stageTab('free')")}${btn('Trades',"stageTab('trades')")}</div>`:''}${S.phase==='rostercheck'&&ui.tab==='free'?faView():S.phase==='rostercheck'&&ui.tab==='trades'?tradeView():content}</div>`}
render=function(){let app=document.getElementById('app');if(!S)init();let body=S.phase==='setup'?stageSetup():S.phase==='draft'?`<div class="stage-wrap"><p class="stage-eyebrow">Opening draft</p><h1 class="stage-title">Build your first XI</h1><p class="stage-desc">Draft 11 Pokémon to begin your dynasty.</p>${draftView()}</div>`:S.phase==='season'||S.phase==='playoffs'?stageSeason():stageOffseason();app.innerHTML=`<header><div><div class="logo">POKÉMON <span>XI</span></div><div class="sub small">DYNASTY · ${S.phase==='setup'?'NEW LEAGUE':esc(me().name)+' · SEASON '+S.season}</div></div><div class="flex"><span class="pill">Autosave On</span>${btn('New Dynasty','resetGame()','outline tinybtn')}</div></header>${body}${ui.notice?`<div class="toast">${esc(ui.notice)}</div>`:''}<p class="muted small" style="text-align:center;padding:22px">Local browser save · No cloud sync</p>`};


/* Version 5: draft scouting and on-field adjacency chemistry */
let draftSort='potential';
const FIELD_SPOTS=[ [2,5],[0,3],[1.35,3],[2.65,3],[4,3],[0,2],[1.35,2],[2.65,2],[4,2],[1.35,0],[2.65,0] ];
function nearbySlots(i,j){let a=FIELD_SPOTS[i],b=FIELD_SPOTS[j];return !!a&&!!b&&Math.hypot(a[0]-b[0],a[1]-b[1])<=1.65}
chemistry=function(p){if(p.owner===null)return 0;let t=S.teams[p.owner];if(!t||!t.formation)return 0;let slot=t.formation.indexOf(p.id);if(slot<0)return 0;let f=family(p),bonus=0;for(let i=0;i<t.formation.length;i++){if(i===slot||!nearbySlots(i,slot))continue;let q=player(t.formation[i]);if(!q)continue;let g=family(q);if(f.region===g.region)bonus+=.05;if(f.type===g.type)bonus+=.05;if(p.stage===q.stage)bonus+=.05;if(p.previousTeam===p.owner&&q.previousTeam===p.owner)bonus+=.05}return Math.min(1,+bonus.toFixed(2))};
function xiScore(t){return t.formation.reduce((sum,id,i)=>{let p=player(id);return sum+(p?rate(p,position(i)):0)},0)}
optLineup=function(t){let remaining=t.roster.slice(),order=[0,9,10,1,2,3,4,5,6,7,8];let formation=Array(11).fill(null);for(let i of order){remaining.sort((a,b)=>{let x=player(a),y=player(b);return (rate(y,position(i))-rate(x,position(i)))});formation[i]=remaining.shift()??null}t.formation=formation;let best=xiScore(t);for(let pass=0;pass<7;pass++){let changed=false;for(let i=0;i<11;i++)for(let j=i+1;j<11;j++){[t.formation[i],t.formation[j]]=[t.formation[j],t.formation[i]];let score=xiScore(t);if(score>best+0.00001){best=score;changed=true}else [t.formation[i],t.formation[j]]=[t.formation[j],t.formation[i]]}if(!changed)break}};
function sortDraftPool(a,b){if(draftSort==='potential')return b.potential-a.potential||value(b)-value(a);let pos=Number(draftSort);return rate(b,pos)-rate(a,pos)||b.potential-a.potential}
function draftFilterMarkup(){return `<div class="draft-sort"><label for="draft-sort-select">Sort prospects by</label><select id="draft-sort-select" onchange="draftSort=this.value;updatePool()">${[['potential','Potential'],['0','Striker'],['1','Midfield'],['2','Defence'],['3','Goalkeeper']].map(([id,name])=>`<option value="${id}" ${draftSort===id?'selected':''}>${name}</option>`).join('')}</select></div>`}
poolMarkup=function(pool,t,initial){return pool.map(p=>{let f=family(p);return `<div class="item draft-prospect">${pokemonImage(pname(p))}<div class="poke-info"><div class="poke-name">${esc(pname(p))} ${p.legendary?'<span class="badge">LEGEND</span>':''}</div><div class="poke-meta">${esc(f.region)} · ${esc(f.type)} · ${esc(p.stage===0?'Base':p.stage===f.forms.length-1?'Final':'Middle')} form · Potential <b>${p.potential.toFixed(1)}</b></div><div class="ratings">${['ST','MID','DEF','GK'].map((n,i)=>`<span>${n} <b>${rate(p,i).toFixed(1)}</b></span>`).join('')}</div></div>${t.id===S.user?btn('DRAFT',`${initial?'draftPlayer':'offDraftPlayer'}(${p.id})`,'tinybtn'):''}</div>`}).join('')||'<p class="muted">No available Pokémon.</p>'};
updatePool=function(){let el=document.getElementById('pool');if(!el)return;let t=S.phase==='draft'?currentPickTeam():offPickTeam();el.innerHTML=poolMarkup(available().filter(p=>pname(p).toLowerCase().includes((ui.search||'').toLowerCase())).sort(sortDraftPool),t,S.phase==='draft')};
const OLD_DRAFT_VIEW=draftView;
draftView=function(){let html=OLD_DRAFT_VIEW();return html.replace(/<input id="search"/,draftFilterMarkup()+'<input id="search"').replace(/<div id="pool" class="scroll">[\s\S]*?<\/div><\/section><section class="panel">/,`<div id="pool" class="scroll">${poolMarkup(available().filter(p=>pname(p).toLowerCase().includes((ui.search||'').toLowerCase())).sort(sortDraftPool),S.phase==='draft'?currentPickTeam():offPickTeam(),S.phase==='draft')}</div></section><section class="panel">`)};

const STARTER_TRIOS=[['Bulbasaur','Charmander','Squirtle'],['Chikorita','Cyndaquil','Totodile'],['Treecko','Torchic','Mudkip'],['Turtwig','Chimchar','Piplup']];
const initOriginalFinal=init;
init=function(){initOriginalFinal();if(S.finalRatings)return;
 const starterIds=new Set(STARTER_TRIOS.flat().map(name=>FAMILIES.find(f=>f.forms[0]===name)?.id));
 for(const p of S.players){let f=family(p);let forms=f.forms.length;
  if(p.legendary){p.potential=+(8.0+random()*1.35).toFixed(1);p.ratings=[0,1,2,3].map((_,i)=>+(5.8+random()*1.5+(i===f.offset?1.0:i===(f.offset+1)%4?.6:i===(f.offset+2)%4?.4:0)).toFixed(1));}
  else if(!starterIds.has(p.family)){p.potential=+(forms===1?6.3+random()*1.65:forms===2?7.0+random()*1.55:7.7+random()*1.65).toFixed(1);p.potential=Math.min(9.4,p.potential);}
  p.growth=0;
 }
 for(const trio of STARTER_TRIOS){let shuffled=shuffle(trio),values=[9.5,9.0,8.5];shuffled.forEach((name,i)=>{let p=S.players.find(x=>family(x).forms[0]===name);if(p){p.potential=values[i];p.ratings=[0,1,2,3].map(()=>+(5.4+random()*.35).toFixed(1));}})}
 S.finalRatings=true;save();};
// Ratings are individual positional specialties; the potential is a ceiling for development, not an instant rating.
rate=function(p,pos){let stage=family(p).forms.length>1?p.stage:0;let evoBoost=p.legendary?0:stage*.43;return clamp(p.ratings[pos]+p.growth+evoBoost+chemistry(p),5,10)};
const originalOffDraftPlayerFinal=offDraftPlayer;
offDraftPlayer=function(id){let before=S.season,previous=S.players.map(p=>({id:p.id,owner:p.owner,stats:{...p.seasonStats},teammates:p.owner===null?0:teamRating(S.teams[p.owner]),wins:p.owner===null?0:S.teams[p.owner].wins}));originalOffDraftPlayerFinal(id);if(S.season!==before){for(const record of previous){let p=player(record.id);if(!p||p.owner===null||p.legendary)continue;let gp=Math.max(1,record.stats.gp),production=(record.stats.g+record.stats.a)/gp,winning=record.wins/38,goodTeammates=(record.teammates-6)/4;let delta=(random()-.52)*.20+Math.min(.12,production*.12)+winning*.07+Math.max(0,goodTeammates)*.045;let current=Math.max(...p.ratings)+p.growth+p.stage*.43;p.growth=clamp(p.growth+delta,-.6,Math.max(-.6,p.potential-current+p.growth));}save();}};

/* VERIFIED REVISION — 2026-10-10: ratings, UI, images, fixture alignment */
const REGIONAL_STARTER_NAMES=new Set(STARTER_TRIOS.flat());
function isRegionalStarter(p){return REGIONAL_STARTER_NAMES.has(family(p).forms[0])}
function baseProfile(p){
 const f=family(p), seed=p.family, major=f.offset%4;
 if(isRegionalStarter(p))return [p.potential,p.potential,p.potential,p.potential];
 let arr=[0,1,2,3].map((i)=>{
   let distance=(i-major+4)%4;
   let penalty=distance===0?0:distance===1?.35+(seed%3)*.18:distance===2?1.15+(seed%5)*.14:1.85+(seed%4)*.21;
   return Math.max(5,+(p.potential-penalty).toFixed(2));
 });
 if(p.legendary){arr=arr.map((v,i)=>i===(major+3)%4?Math.max(6.0,v-.8):Math.max(7.1,v));}
 return arr;
}
// Potential is a visible projection, not a guaranteed result; the starter allocation is exclusive.
rate=function(p,pos){
 if(!p)return 0;
 let f=family(p), maxStage=Math.max(1,f.forms.length-1), stageRatio=f.forms.length===1?1:p.stage/maxStage;
 let target=baseProfile(p)[pos];
 let entry=f.forms.length===1?target-.22:5.15+((p.family*37+pos*19)%17)*.085;
 let skill=entry+(target-entry)*stageRatio;
 let development=(p.growth||0);
 let bonus=chemistry(p);
 return +clamp(skill+development+bonus,5,isRegionalStarter(p)?9.5:9.49).toFixed(2);
};
value=function(p){let positions=[0,1,2,3].map(i=>rate(p,i)-chemistry(p)).sort((a,b)=>b-a);let projected=Math.max(...baseProfile(p));return Math.round(clamp((positions[0]*.45+positions[1]*.25+positions[2]*.15+positions[3]*.15)*8+projected*2,45,100))};
// Keep one Optimize XI action on the roster; no alternative Top XI mode.
const previousStageSeasonRevision=stageSeason;
stageSeason=function(){let html=previousStageSeasonRevision();return html.replace('<h2>Starting XI</h2>','<h2>Top XI</h2>').replace(/<p class="muted">Tap two Pokémon to swap positions\.<\/p>/,'<p class="muted">Position and adjacent-player chemistry are included.</p>')};
// Use the official 20 crests, and make the full name part of the selectable card.
stageSetup=function(){return `<div class="stage-wrap"><p class="stage-eyebrow">A new dynasty begins</p><h1 class="stage-title">Choose your club</h1><p class="stage-desc">20 clubs. One legacy. Select a club to enter the draft.</p><div class="team-choice">${NAMES.map((n,i)=>`<label class="club-card"><input type="radio" name="club" value="${i}" ${i===0?'checked':''}>${crest(S.teams[i])}<span>${esc(n)}</span></label>`).join('')}</div><div class="stage-start">${btn('Begin Draft','stageStart()')}</div></div>`};
// Guaranteed readable, numeric Pokédex image URLs; never print a URL as leaderboard text.
function pokemonDexId(p){let f=family(p);let name=pname(p);let species={};let n=1;for(const ff of FAMILIES)for(const form of ff.forms){species[form.toLowerCase()]=n++;}return species[name.toLowerCase()]||p.family+1}
// Pokémon Showdown PNG images by species name; fallback to official PokéAPI image by known family ID.
pokemonImage=function(name,small=false){let slug=POKE_ALIAS[name]||String(name).replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase().replace(/[^a-z0-9-]/g,'');return `<img class="poke-thumb ${small?'sm':''}" alt="${esc(name)}" loading="lazy" src="https://play.pokemonshowdown.com/sprites/dex/${slug}.png" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png'">`};
// Align both crests and names around a fixed central score.

// Fix leaderboard image, team label, stat alignment and horizontal overflow.
statsView=function(){let cats=[['goals','Goals'],['assists','Assists'],['points','Points'],['winpct','Win%'],['saves','Saves'],['shutouts','Shutouts'],['wins','Wins']],k=ui.stats||'goals',season=ui.seasonStats;let players=[...S.players].filter(p=>(season?p.seasonStats:p.stats).gp>0).sort((a,b)=>metric(b,k,season)-metric(a,k,season));return `<section class="panel"><div class="leader-heading"><h2>Leaders</h2><div class="toolbar">${btn('Season '+S.season,'ui.seasonStats=true;render()',season?'':'outline')}${btn('All-Time','ui.seasonStats=false;render()',!season?'':'outline')}</div></div><div class="leader-cats">${cats.map(([key,name])=>btn(name,`ui.stats='${key}';render()`,k===key?'':'outline')).join('')}</div><div class="leader-list">${players.slice(0,50).map((p,i)=>{let stat=season?p.seasonStats:p.stats;return `<div class="leader-row"><span class="leader-rank">${i+1}</span>${pokemonImage(pname(p),true)}<div class="leader-player"><b>${esc(pname(p))}</b><small>${p.owner===null?'Free Agent':esc(S.teams[p.owner].name)} · ${stat.gp} GP</small></div><strong class="leader-value">${k==='winpct'?metric(p,k,season).toFixed(1)+'%':metric(p,k,season)}</strong></div>`}).join('')||'<p class="muted">No matches played yet.</p>'}</div></section>`};
// Offseason development: small, two-way changes driven by production, wins and teammate quality.
const preRevisionOffDraftPlayer=offDraftPlayer;
offDraftPlayer=function(id){let year=S.season;let record=S.players.map(p=>({id:p.id,owner:p.owner,stat:{...p.seasonStats},team:p.owner===null?null:S.teams[p.owner],growth:p.growth||0}));preRevisionOffDraftPlayer(id);if(S.season!==year){for(let old of record){let p=player(old.id);if(!p||p.owner===null||p.legendary)continue;let gp=Math.max(1,old.stat.gp),performance=(old.stat.g+old.stat.a)/gp,win=old.team?old.team.wins/38:0,teammates=old.team?teamRating(old.team):6;let delta=(random()-.56)*.20+Math.min(.09,performance*.10)+win*.055+Math.max(0,teammates-7)*.023;p.growth=clamp(old.growth+delta,-.65,.48);}save();}};
// Show playoffs inside Standings rather than as an extra main navigation tab.
const previousStandingsRevision=standingsView;
standingsView=function(){return previousStandingsRevision()+(S.playoffRounds?.length?playoffsView():'')};


/* Gameplay corrections: adjacent chemistry and formation-aware optimization. */
const XI_ADJ=[[1,2],[0,2,5],[0,1,3,6],[2,4,7],[3,8],[1,6,9],[2,5,7,9],[3,6,8,10],[4,7,10],[5,6,10],[7,8,9]];
chemistry=function(p){if(p.owner===null)return 0;let t=S.teams[p.owner],slot=t.formation.indexOf(p.id);if(slot<0)return 0;let bonus=0;for(let j of XI_ADJ[slot]){let q=player(t.formation[j]);if(!q)continue;let a=family(p),b=family(q);if(a.region===b.region)bonus+=.05;if(a.type===b.type)bonus+=.05;if(p.stage===q.stage)bonus+=.05;if(p.previousTeam===p.owner&&q.previousTeam===p.owner)bonus+=.05;}return Math.min(1,+bonus.toFixed(2))};
function xiLineupScore(t,ids){let score=0;for(let i=0;i<11;i++){let p=player(ids[i]);if(!p)continue;score+=rate(p,position(i))-chemistry(p);for(let j of XI_ADJ[i]){if(j<=i)continue;let q=player(ids[j]);if(!q)continue;let a=family(p),b=family(q);score+=(a.region===b.region?.1:0)+(a.type===b.type?.1:0)+(p.stage===q.stage?.1:0)+(p.previousTeam===t.id&&q.previousTeam===t.id?.1:0)}}return score}
optLineup=function(t){let ids=t.roster.slice();if(!ids.length){t.formation=[];return}let slots=Array(11).fill(null),remaining=ids.slice();for(let i of [0,9,10,1,2,3,4,5,6,7,8]){remaining.sort((a,b)=>rate(player(b),position(i))-rate(player(a),position(i)));slots[i]=remaining.shift()??null}let best=xiLineupScore(t,slots);for(let pass=0;pass<4;pass++){let improved=false;for(let i=0;i<11;i++)for(let j=i+1;j<11;j++){[slots[i],slots[j]]=[slots[j],slots[i]];let score=xiLineupScore(t,slots);if(score>best+1e-7){best=score;improved=true}else [slots[i],slots[j]]=[slots[j],slots[i]]}if(!improved)break}t.formation=slots};
// Ensure saved old dynasties retain their results while correcting impossible potential values.
const xiPreviousInit=init;
init=function(){xiPreviousInit();if(!S.xiPotentialValidated){for(let p of S.players)if(p.potential>9.5)p.potential=9.4;S.xiPotentialValidated=true;save()}};
