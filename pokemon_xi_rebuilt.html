function toggle(arr,id){UI[arr]=UI[arr].includes(id)?UI[arr].filter(z=>z!==id):[...UI[arr],id];render()}function propose(){let r=trade(UI.give,UI.take,UI.givePicks,UI.takePicks,UI.target);UI.counter=r.ok?null:r.msg;if(r.ok){UI.give=[];UI.take=[];UI.givePicks=[];UI.takePicks=[];UI.counter='Trade accepted'}render()}
function sign(id){if(me().roster.length>=11)return alert('Release a Pokémon first');assign(id,me());save();render()}function drop(id){release(id);save();render()}function setTab(x){UI.tab=x;render()}function metric(x,k){let z=UI.career?x.stats:x.seasonStats;return k==='goals'?z.g:k==='assists'?z.a:k==='points'?z.g+z.a:k==='shutouts'?z.so:k==='savepct'?(z.shots?100*z.saves/z.shots:0):k==='winpct'?(z.gp?100*z.w/z.gp:0):x.titles}
function button(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function roster(team){return `<div class="scroll">${team.roster.map(id=>{let x=p(id);return `<div class="item"><span>${esc(name(x))} <small class="muted">${fmt(overall(x))} OVR</small></span><small>ST ${fmt(rating(x,0))} · MID ${fmt(rating(x,1))} · DEF ${fmt(rating(x,2))} · GK ${fmt(rating(x,3))}</small></div>`}).join('')}</div>`}
function setupView(){return `<section class="panel"><h2>Choose your club</h2><select id="teamSelect">${S.teams.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select> ${button('Start dynasty','start()')}</section>`}
function draftView(){let initial=S.phase==='draft',team=initial?draftTeam():offTeam(),pool=free().filter(x=>name(x).toLowerCase().includes(UI.search.toLowerCase())).sort((a,b)=>value(b)-value(a));return `<section class="panel"><h2>${initial?'Initial Snake Draft':'Offseason Draft'} · Round ${Math.floor((initial?S.draftIndex:S.offIndex)/20)+1}</h2><p>On the clock: ${team.name} · ${initial?'11-round snake':'6-round fixed order'}</p><div class="toolbar">${initial&&S.draftIndex===0?button('Reroll draft order','reroll()','outline'):''}${button('Skip to my pick',initial?'skipDraft()':'skipOff()','outline')}${button('Autodraft remaining',initial?'skipDraft(true)':'skipOff(true)','outline')}</div><input placeholder="Search Pokémon" value="${esc(UI.search)}" oninput="UI.search=this.value;render()"><div class="scroll">${pool.slice(0,100).map(x=>`<div class="item"><span><b>${esc(name(x))}</b> <small class="muted">${fmt(overall(x))} · ${value(x)} value</small></span>${team.id===S.user?button('Draft',`${initial?'draft':'offPick'}(${x.id})`):''}</div>`).join('')}</div></section>`}
function home(){let team=me();return `<div class="statcards"><div class="statcard">Season<strong>${S.season}</strong></div><div class="statcard">Week<strong>${S.week}/38</strong></div><div class="statcard">Record<strong>${team.w}-${team.d}-${team.l}</strong></div><div class="statcard">OVR<strong>${fmt(teamOVR(team))}</strong></div></div><section class="panel"><h2>${esc(team.name)}</h2><p>${S.phase==='camp'||S.phase==='offcamp'?'Training camp':S.phase==='playoffs'?'Playoffs':S.phase==='keepers'?'Keeper selection':'Season in progress'}</p><div class="toolbar">${S.phase==='camp'||S.phase==='offcamp'?button('Complete Training Camp','trainingCamp()'):''}${S.phase==='season'?button('Simulate Matchweek','playWeek()'):''}${S.phase==='playoffs'?button('Simulate One Playoff Game Per Series','playoffGame()'):''}${S.phase==='keepers'?button('Select Keepers',"setTab('keepers')"):''}</div><h3>Optimized XI · Chemistry Included</h3>${roster(team)}</section>${S.results.length?`<section class="panel"><h3>Last results</h3>${S.results.at(-1).map(m=>`<div class="item">${t(m.a).name} ${m.ga}–${m.gb} ${t(m.b).name}</div>`).join('')}</section>`:''}`}
function statsView(){let cats=[['goals','Goals'],['assists','Assists'],['points','Points'],['shutouts','Shutouts'],['savepct','Save percentage'],['winpct','Win percentage'],['titles','Championships']],players=[...S.players].filter(x=>UI.stat==='titles'?x.titles>0:(UI.career?x.stats:x.seasonStats).gp>0).sort((a,b)=>metric(b,UI.stat)-metric(a,UI.stat));return `<section class="panel"><h2>Player Leaderboards</h2><div class="toolbar">${button('Season',"UI.career=false;render()",UI.career?'outline':'')}${button('Career',"UI.career=true;render()",UI.career?'':'outline')}</div><div class="toolbar">${cats.map(([k,l])=>button(l,`UI.stat='${k}';render()`,UI.stat===k?'':'outline')).join('')}</div><table><tr><th>#</th><th>Pokémon</th><th>Club</th><th>Value</th></tr>${players.slice(0,50).map((x,i)=>`<tr><td>${i+1}</td><td>${name(x)}</td><td>${x.owner===null?'FA':t(x.owner).name}</td><td>${['savepct','winpct'].includes(UI.stat)?fmt(metric(x,UI.stat))+'%':metric(x,UI.stat)}</td></tr>`).join('')}</table></section>`}
function standingsView(){return `<section class="panel"><h2>Standings</h2><table><tr><th>Club</th><th>W</th><th>D</th><th>L</th><th>PTS</th><th>OVR</th></tr>${standings().map(x=>`<tr><td>${x.name}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.w*3+x.d}</td><td>${fmt(teamOVR(x))}</td></tr>`).join('')}</table></section><section class="panel"><h3>All-Time Standings</h3>${[...S.teams].sort((a,b)=>b.allW-a.allW).map(x=>`<div class="item">${x.name} · ${x.allW}-${x.allD}-${x.allL} <b>${x.titles} titles</b></div>`).join('')}</section>`}
function playoffsView(){return `<section class="panel"><h2>Playoffs · Top 8 · Best of 7</h2>${S.playoffs.map((r,i)=>`<h3>${['Quarterfinals','Semifinals','Final'][i]}</h3>${r.pairs.map(q=>`<div class="item">${t(q.a).name} <b>${q.aw}–${q.bw}</b> ${t(q.b).name} <small>${q.games.length} games</small></div>`).join('')}`).join('')}${S.phase==='playoffs'?button('Simulate Next Games','playoffGame()'):''}${S.champion!==null?`<p>Last champion: ${t(S.champion).name}</p>`:''}</section>`}
function keepersView(){return `<section class="panel"><h2>Choose Five Keepers (${me().keepers.length}/5)</h2>${me().roster.map(id=>`<div class="item">${name(p(id))} ${button(me().keepers.includes(id)?'Selected':'Keep',`keeper(${id})`)}</div>`).join('')}${button('Submit Keepers','submitKeepers()')}</section>`}
function tradeView(){let other=t(UI.target===S.user?(S.user+1)%20:UI.target);UI.target=other.id;let choices=(team,arr)=>team.roster.map(id=>`<div class="item"><label><input type="checkbox" style="width:auto" ${UI[arr].includes(id)?'checked':''} onchange="toggle('${arr}',${id})"> ${name(p(id))}</label><b>${value(p(id))}</b></div>`).join(''),pickChoices=(team,arr)=>S.picks.filter(q=>q.owner===team.id&&!q.used&&q.year>S.season&&q.year<=S.season+3).map(q=>`<div class="item"><label><input type="checkbox" style="width:auto" ${UI[arr].includes(q.id)?'checked':''} onchange="toggle('${arr}','${q.id}')"> Y${q.year} R${q.round}</label><b>${pickValue(q)}</b></div>`).join('');return `<section class="panel"><h2>Trade Centre</h2><select onchange="UI.target=+this.value;UI.give=[];UI.take=[];UI.givePicks=[];UI.takePicks=[];render()">${S.teams.filter(x=>x.id!==S.user).map(x=>`<option value="${x.id}" ${x.id===other.id?'selected':''}>${x.name}</option>`).join('')}</select><div class="grid"><div><h3>Offer Pokémon</h3>${choices(me(),'give')}<h3>Offer Picks</h3><div class="scroll">${pickChoices(me(),'givePicks')}</div></div><div><h3>Request Pokémon</h3>${choices(other,'take')}<h3>Request Picks</h3><div class="scroll">${pickChoices(other,'takePicks')}</div></div></div><p>Offer value: ${tradeScore(UI.give,UI.givePicks)} · Request value: ${tradeScore(UI.take,UI.takePicks)}</p>${button('Propose Trade','propose()')} ${UI.counter?`<p class="accent">${UI.counter}</p>`:''}</section>`}
function freeView(){return `<section class="panel"><h2>Free Agency</h2>${free().sort((a,b)=>value(b)-value(a)).slice(0,80).map(x=>`<div class="item">${name(x)} · ${fmt(overall(x))} ${button('Sign',`sign(${x.id})`)}</div>`).join('')}<h3>Your Roster</h3>${me().roster.map(id=>`<div class="item">${name(p(id))} ${button('Release',`drop(${id})`,'outline')}</div>`).join('')}</section>`}
function render(){let tabs=['home','draft','standings','stats','playoffs','trades','free','keepers'];let page=S.phase==='setup'?setupView():`<div class="stage-wrap"><div class="stage-eyebrow">Pokémon XI · Dynasty</div><h1 class="stage-title">${esc(me().name)}</h1><div class="stage-tabs">${tabs.map(x=>button(x.toUpperCase(),`setTab('${x}')`,UI.tab===x?'':'outline')).join('')}</div>${S.phase==='draft'||S.phase==='offdraft'?draftView():UI.tab==='standings'?standingsView():UI.tab==='stats'?statsView():UI.tab==='playoffs'?playoffsView():UI.tab==='trades'?tradeView():UI.tab==='free'?freeView():UI.tab==='keepers'&&S.phase==='keepers'?keepersView():home()}</div>`;$('app').innerHTML=`<header><div class="logo">POKÉMON <span>XI</span></div><small class="muted">Rebuilt dynasty engine</small></header>${page}`}
load();render();

</script></body></html>
